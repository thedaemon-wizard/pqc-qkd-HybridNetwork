# =====================================================================
# Override file: strongSwan IPsec/IKEv2 nodes (alice-ipsec, bob-ipsec).
#
#   * RFC 9370 hybrid key exchange : ECP-256 + ML-KEM-768
#   * RFC 8784 PPK                 : arnika's HKDF-SHA3-256(QKD || PQC-HPKE)
#                                    output, injected natively over the VICI
#                                    socket
#
# No Rosenpass on this lane. The PQC half is agreed by arnika itself, over
# HPKE with the peer (KEM MLKEM1024-P384, codepoint 0x0051 from
# draft-ietf-hpke-pq, not yet an RFC), on the same authenticated UDP channel
# as the key_ID, so these nodes mount no key file and depend on no WireGuard
# node. The arnika pin is the head of the still-OPEN upstream PR #51; see
# .gitmodules.
#
# Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.strongswan.yml \
#                   --profile ipsec up -d
# =====================================================================
name: pqcqkd

# Proposal strings and the reauth period are defined once and shared, so the
# two peers cannot drift apart. Both ends MUST agree on the ke1_ slot number:
# ke1_mlkem768 on one side and ke2_mlkem768 on the other simply will not match.
#
# `mlkem768` is the only spelling strongSwan's proposal parser accepts
# (src/libstrongswan/crypto/proposal/proposal_keywords_static.txt:182).
# `ml_kem_768` is the long name used in log output and does NOT parse.
x-ipsec-crypto: &ipsec-crypto
  IKE_PROPOSALS: aes256gcm16-prfsha384-ecp256-ke1_mlkem768
  ESP_PROPOSALS: aes256gcm16-ecp256-ke1_mlkem768
  # RFC 8784 PPKs apply to the initial IKE SA only, so fresh QKD material is
  # consumed by reauthenticating rather than rekeying.
  #
  # arnika drives that reauthentication after each key rotation. This value is
  # only the backstop for arnika rotating silently without exiting, so it MUST
  # be several times ARNIKA_INTERVAL. It was previously set to ARNIKA_INTERVAL
  # itself, which made charon a second reauth driver running at the same cadence
  # as the first and racing it -- not a safety net at all.
  REAUTH_TIME: ${REAUTH_TIME:-300s}
  VICI_CONNECTION: pqcqkd-vpn
  # The CHILD_SA name under connections.pqcqkd-vpn.children, used by the
  # initiator to bring the lane up when no IKE_SA exists. Must match
  # swanctl.conf.tmpl.
  VICI_CHILD: tunnel
  # The swanctl.conf secrets.ppk section holding the pre-QKD bootstrap key.
  # The adapter unloads it after the first rotation: it answers the same
  # PPK_ID as the rotated credential but contains no QKD material.
  VICI_BOOTSTRAP_ID: ppk-qkd-bootstrap
  # Stable PPK identity; the key material behind it is what rotates.
  VICI_PPK_ID: ppk-qkd@pqcqkd.local
  VICI_REAUTH_TIMEOUT: ${VICI_REAUTH_TIMEOUT:-10s}
  ARNIKA_MODE: ${ARNIKA_MODE:-QkdAndPqcRequired}
  # arnika's own HPKE key agreement with the peer supplies the PQC half.
  # Set here, in the anchor, and not per node: both peers must agree, and
  # MODE=QkdAndPqcRequired refuses to start with it off. entrypoint.sh
  # rejects any value but exactly `true` or `false`, because arnika treats
  # every other string as off. The PQC round settings (PQC_ROUND_INTERVAL,
  # PQC_ROUND_TIMEOUT, PQC_MAX_KEY_AGE) are left unset on purpose: arnika
  # derives them from INTERVAL, and pinning copies here would let them drift
  # from ARNIKA_INTERVAL below.
  PQC_ENABLED: "true"
  # 30s is a DEVIATION from the reference design, recorded here because it is a
  # candidate variable in the unresolved intermittent PPK mismatch rather than a
  # value that was reasoned about when it was chosen.
  #
  # QCI-CAT deliverable D6.1 (v1.0, 2025; A. Neuhold and G. Swoboda of CANCOM,
  # arnika's original developers) describes arnika v1.x. It recommends 120s so
  # the rotation aligns with WireGuard's rekey, which happens after 120 seconds
  # or after 2^60 messages (the exponent is a superscript in the PDF). "Default
  # value" there is the v1.x default; the pinned config.go defaults INTERVAL to
  # 10s. That rationale is specific to the WireGuard lane. This lane
  # reauthenticates IKEv2 instead, so the alignment argument does not transfer
  # unchanged -- but it does not obviously fail to apply either.
  #
  # D6.1's master/backup rule (the peer that receives a key_id first becomes
  # the backup) is NOT what the pinned arnika runs. The pin re-elects the role
  # every interval from HMAC-SHA256(ARNIKA_PSK, interval number) XOR ARNIKA_ID
  # (IsPrimary in submodules/arnika/config/config.go), so at 30s the role is
  # re-elected four times as often as at 120s. What survived the change is the
  # exchange itself: the PRIMARY fetches enc_keys and sends the key_id, and the
  # BACKUP resolves it through dec_keys. At the previous pin (3a8cc13) that
  # exchange was where the mismatch had been localised. At this pin the PRIMARY
  # writes its key only after the BACKUP acknowledges the key_id; reading the
  # code suggests that moves the exposed intervals from alice-PRIMARY to
  # alice-BACKUP rather than removing them. That is not measured yet.
  #
  # Moving this lane to a CNSA 2.0 profile is not a change of one variable
  # either. NSA's IKEv2 profile keeps CNSA 1.0 key establishment (ECDH P-384)
  # and adds ML-KEM-1024, so both proposal strings above change curve and KEM;
  # the healthchecks below probe for ML_KEM_768 by name. The CI `ipsec` job
  # reads the expected parameter set from IKE_PROPOSALS, so it follows an edit.
  #
  # Do NOT read this as a diagnosis. The measured rotation gaps here are 30, 90,
  # 90, 60, 241, 120 and 120 seconds, which match neither 30s nor 120s, so the
  # interval is not the only thing setting the cadence. See docs/vici-ppk.md.
  ARNIKA_INTERVAL: ${ARNIKA_INTERVAL:-30s}
  ARNIKA_PSK: ${ARNIKA_PSK:?ARNIKA_PSK must be set in .env}

services:

  alice-ipsec:
    build:
      context: .
      dockerfile: nodes/strongswan/Dockerfile
    image: pqcqkd/strongswan:local
    container_name: alice-ipsec
    profiles: ["ipsec"]
    # A peer that is not up yet is a normal transient state at boot,
    # not a reason to stay dead.
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
    environment:
      <<: *ipsec-crypto
      NODE_NAME: alice-ipsec
      LOCAL_IP: 10.30.0.20
      PEER_IP: 10.30.0.21
      LOCAL_ID: alice@pqcqkd.local
      PEER_ID: bob@pqcqkd.local
      # ETSI GS QKD 014 clause 5.1: the SAE ID in the path names the PEER --
      # enc_keys names the slave SAE, dec_keys the master. From Alice both are
      # BOB, which is why a single base URL serves both directions.
      KMS_URL: http://bb84-kme-a:8080/api/v1/keys/BOB
      LISTEN_ADDRESS: 0.0.0.0:9998
      SERVER_ADDRESS: bob-ipsec:9998
      # Must differ from the peer's -- arnika XORs it into the master election.
      ARNIKA_ID: ${ARNIKA_ID_ALICE_IPSEC:-11}
      VICI_CREDENTIAL_PREFIX: qkd-bob
      # The two peers share one IKE_SA, so exactly one of them initiates it and
      # exactly one reauthenticates it after a key rotation. This single value
      # decides both. It is unrelated to arnika's PRIMARY/BACKUP election, which
      # alternates every interval and decides who *generates* the key.
      VICI_IKE_ROLE: initiator
    # Only the KME. The PQC half no longer comes from a Rosenpass key file
    # written by the WireGuard node, so there is no volume to share with it
    # and no reason to start it first.
    depends_on:
      bb84-kme-a:
        condition: service_healthy
    # The ping is an ESP probe, not a health criterion: `|| true` keeps a
    # dropped echo (the moment between two CHILD_SAs) from marking the node
    # unhealthy. Without it nothing on the host ever sent traffic through the
    # tunnel, so /vpn read 0 B / 0 pkt under "established" -- the same reading
    # a policy bypass would give. One 84-byte echo per interval makes the
    # counters observed rather than explained.
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-algs | grep -q ML_KEM_768 && { ping -c1 -W2 \"$$PEER_IP\" >/dev/null 2>&1 || true; }"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      qkd-net: {}
      wan-net:
        ipv4_address: 10.30.0.20

  bob-ipsec:
    build:
      context: .
      dockerfile: nodes/strongswan/Dockerfile
    image: pqcqkd/strongswan:local
    container_name: bob-ipsec
    profiles: ["ipsec"]
    # A peer that is not up yet is a normal transient state at boot,
    # not a reason to stay dead.
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
    environment:
      <<: *ipsec-crypto
      NODE_NAME: bob-ipsec
      LOCAL_IP: 10.30.0.21
      PEER_IP: 10.30.0.20
      LOCAL_ID: bob@pqcqkd.local
      PEER_ID: alice@pqcqkd.local
      KMS_URL: http://bb84-kme-b:8080/api/v1/keys/ALICE
      LISTEN_ADDRESS: 0.0.0.0:9998
      SERVER_ADDRESS: alice-ipsec:9998
      ARNIKA_ID: ${ARNIKA_ID_BOB_IPSEC:-12}
      # See alice-ipsec. Must be the opposite role.
      VICI_IKE_ROLE: responder
      VICI_CREDENTIAL_PREFIX: qkd-alice
    depends_on:
      bb84-kme-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-algs | grep -q ML_KEM_768"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      qkd-net: {}
      wan-net:
        ipv4_address: 10.30.0.21
