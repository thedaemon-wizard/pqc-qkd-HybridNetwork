name: CI

on:
  push:
    # `main` is the only long-lived branch; feature branches are covered by the
    # pull_request trigger below.
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r services/bb84-kme/requirements.txt
          pip install -r services/webui-backend/requirements.txt

      # No `|| true`: the Makefile targets used to swallow lint failures, so
      # they never gated anything.
      #
      # `ruff format --check` is deliberately NOT run here. The existing code
      # predates the formatter and reformatting it would be a ~38-file
      # cosmetic diff; that is worth doing as its own change, not as a gate
      # that fails every PR until someone does it.
      - name: Lint
        run: ruff check services/ tests/ tools/ benchmarks/

      # Three of the fifteen submodules, shallowly -- not `submodules:
      # recursive`. Each is here because a guard DERIVES a claim from it and
      # self-skips without it, which meant the guard was silent in the only job
      # that runs it:
      #
      #   rosenpass                    the KEM names come from the pinned
      #                                domain-separation label
      #   tno-qkd-key-rate             the independent-engine cross-check reads
      #                                the upstream bb84.py it compares against
      #                                (536K shallow)
      #   qkd-pqc-paper-supplementary  the units guard reads the real CSV
      #                                headers, so an upstream column rename is
      #                                what makes it fail (1.7M shallow)
      #
      # strongswan is deliberately NOT added: it is 183 MB, and the `go` job
      # already checks it out recursively, so the notify-payload guard runs
      # there instead of making every push pay for it twice.
      - name: Check out the pinned submodules the guards derive from
        run: |
          git submodule update --init --depth 1 \
            submodules/rosenpass \
            submodules/tno-qkd-key-rate \
            submodules/qkd-pqc-paper-supplementary

      # benchmarks/results/ is gitignored, so this artefact never exists on a
      # fresh checkout and all four guards in
      # tests/test_paper_comparison_says_what_it_averaged.py skipped -- the file
      # was inert in CI and ran only on a developer machine that happened to
      # have generated it once.
      #
      # Generating it here is also the stronger test: the guards then run
      # against the REAL upstream CSV headers, which is the thing that can
      # change under us. `ours` is legitimately absent (no handshake_age.csv is
      # produced in CI) and the producer records that as n=0 WITH a note --
      # which is exactly the distinction the third guard checks.
      - name: Generate the paper comparison the units guards read
        run: python tools/compare_to_paper.py

      # Contract tests self-skip without a live KME; the `live-stack` job runs
      # them for real.
      - name: Unit tests
        run: pytest tests/ -v

  keyrate:
    name: Key-rate model — golden vector and port parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/webui-frontend/package-lock.json

      - run: pip install pytest pytest-asyncio numpy pyyaml
      - run: npm ci
        working-directory: services/webui-frontend

      # Pins the model to published values (Ma et al. 2005, GYS worked example:
      # R = 2.555e-3 bits/pulse) and checks the TypeScript port still agrees
      # with the Python reference. The same model is implemented three times in
      # this repo, so drift is a real risk.
      - name: Golden vector and cross-implementation parity
        run: pytest tests/test_keyrate_golden_vector.py tests/test_keyrate_ports_agree.py -v

  frontend:
    name: Frontend — typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/webui-frontend/package-lock.json

      - run: npm ci
        working-directory: services/webui-frontend

      # `npm run build` was `vite build` alone for a long time, so type errors
      # accumulated unnoticed. tsc is part of the build now; this makes it a gate.
      - name: Typecheck
        run: npm run typecheck
        working-directory: services/webui-frontend

      # The BB84 channel replay and the key-pool model had no test of any kind
      # until vitest was added -- the frontend carries real simulation code, so
      # "it compiles" was never enough of a gate.
      - name: Unit tests
        run: npm test
        working-directory: services/webui-frontend

      - name: Build
        run: npx vite build
        working-directory: services/webui-frontend

  go:
    name: arnika VICI adapter — vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          # arnika hardens key material with runtime/secret, which needs 1.26.
          go-version: "1.26"

      # Builds the adapter against the pinned upstream arnika tree exactly as
      # nodes/strongswan/Dockerfile does, so the image build cannot be the
      # first place a compile error shows up.
      # Build, vet and test all run inside the tree build.sh assembles.
      #
      # -tags strongswan_vici is required, not decorative: strongswanvici.go
      # carries that build constraint, so without it the adapter selector --
      # including the VICI_IKE_ROLE validation that decides which peer owns the
      # IKE_SA -- is excluded from both vet and test. But the tag only compiles
      # once build.sh has narrowed wireguardnetlink.go's own tag; otherwise both
      # adapters define getKeyWriterService. That is why this is one step and
      # not two: a separate step with its own copy of the overlay drifted from
      # build.sh and vetted an unpatched tree.
      - name: Build, vet and test with the strongswan_vici adapter
        env:
          ARNIKA_VICI_VET_AND_TEST: "1"
        run: sh services/arnika-vici/build.sh submodules/arnika services/arnika-vici /tmp/arnika-vici

      # This guard derives its claims from two pinned trees -- strongSwan's
      # notify_payload.h (which Status Types exist, and that 16444 is still the
      # highest) and arnika's kdf.go (the exact HKDF call the SP 800-227
      # analysis is written against). Without them it self-skips, and the
      # `python` job that runs the rest of tests/ checks out neither.
      #
      # It lives here rather than there because this job has already paid for
      # `submodules: recursive`; adding 183 MB of strongSwan to the Python job
      # to run five assertions would cost every push far more than a pip
      # install of pytest costs this one.
      # setup-python rather than the runner's system interpreter: Ubuntu 24.04
      # marks that one externally-managed (PEP 668), so a bare `pip install`
      # into it exits non-zero.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest-asyncio is not used by this file. It is installed because
      # pytest.ini sets asyncio_mode and asyncio_default_fixture_loop_scope for
      # the suite as a whole, and without the plugin pytest prints two
      # "Unknown config option" warnings on every run of this job -- noise that
      # would camouflage a real warning later. Verified with a pytest-only
      # virtualenv first: the file passes either way, so this is for the log,
      # not for correctness.
      - name: Claims derived from the pinned strongSwan and arnika trees
        run: |
          python -m pip install --quiet pytest pytest-asyncio
          python -m pytest tests/test_claims_about_the_pinned_strongswan_hold.py -v

  env-example:
    name: Example env files satisfy the compose set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates the ENTIRE file before selecting services, so a
      # missing ${VAR:?} aborts an `up` that names only unrelated ones. A
      # mandatory variable absent from the example file operators are told to
      # copy is therefore a total deploy failure, and it was one: the public
      # demo sat on a two-month-old build because deploy/.env.example never
      # listed ARNIKA_PSK.
      - name: Check
        run: sh scripts/check_env_example.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Promised in the README pre-release checklist since before publication.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit MESSAGES are published alongside the tree, and gitleaks does not
      # read them. This repository has already shipped a commit whose message
      # named the assistant tooling used to drive a browser check -- in the very
      # commit that removed those references from the files. Messages cannot be
      # edited after the fact without rewriting history, so the check belongs on
      # the way in.
      - name: Commit messages are free of tooling references
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # A first push to a new branch reports an all-zero "before".
          case "${range}" in 0000000*) range="HEAD~1..HEAD" ;; esac

          bad=$(git log --format='%H %s%n%b' "${range}" \
                | grep -inE 'claude|anthropic|copilot|chatgpt|\bLLM\b|devtools mcp|co-authored-by: *claude' \
                || true)
          if [ -n "${bad}" ]; then
            echo "::error::commit message(s) in ${range} reference assistant tooling:"
            printf '%s\n' "${bad}"
            exit 1
          fi
          echo "ok: no tooling references in ${range}"

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The strongSwan image previously could not build at all (it COPY'd a
      # liboqs lib64 directory that is never created on Debian) and nothing
      # noticed, because no job ever built it.
      - name: strongSwan node
        run: docker build -f nodes/strongswan/Dockerfile -t pqcqkd/strongswan:ci .

      # ML-KEM must be reachable at runtime, not merely compiled: the plugin
      # also has to be named in charon's `load` line. Assert it end-to-end.
      - name: ML-KEM-768 is available to charon
        run: |
          docker run --rm --cap-add NET_ADMIN --entrypoint sh pqcqkd/strongswan:ci -c '
            /usr/local/libexec/ipsec/charon 2>/dev/null &
            for i in $(seq 1 30); do [ -S /var/run/charon.vici ] && break; sleep 1; done
            swanctl --list-algs | grep -q "ML_KEM_768" \
              || { echo "FATAL: ML_KEM_768 not available"; swanctl --list-algs; exit 1; }
            echo "OK: $(swanctl --list-algs | grep ML_KEM_768)"
          '

      - name: WireGuard node
        run: docker build -f nodes/alice/Dockerfile -t pqcqkd/node-alice:ci .

      # Nothing built this image, which is how it stayed broken: its
      # liboqs-python pin became unsatisfiable on PyPI and nobody noticed until
      # a deploy tried to rebuild. The Dockerfile ends with an ML-KEM-768
      # roundtrip and an ML-DSA-65 sign/verify, so a green build here is also a
      # statement that the post-quantum primitives actually work in the image.
      - name: PQC validator
        run: docker build -f services/pqc-validator/Dockerfile -t pqcqkd/pqc-validator:ci .

      # The interop cross-check needs liboqs, which the host job does not have,
      # so those tests skip there and would give false assurance. Run them where
      # liboqs exists by construction -- inside the image that ships it.
      # The whole repo is mounted, not just tests/: conftest.load_service_app
      # resolves `services/<name>/app` relative to the repo root, and mounting
      # tests/ alone made that path absent inside the image.
      - name: ML-KEM interoperability cross-check (inside the image)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            --entrypoint sh pqcqkd/pqc-validator:ci -c '
              pip install --quiet --no-cache-dir pytest httpx || exit 1
              cd /repo && python -m pytest \
                tests/test_pqc_interop_is_a_real_crosscheck.py \
                tests/test_mlkem_kat_matches_liboqs.py \
                tests/test_agility_matrix_spans_two_families.py \
                -q -p no:cacheprovider -o cache_dir=/tmp/pytest-cache
            '

  live-stack:
    name: ETSI GS QKD 014 contract tests (live KMEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio httpx

      - name: Start the two KMEs
        run: |
          cp .env.example .env
          sed -i "s|^ARNIKA_PSK=.*|ARNIKA_PSK=$(openssl rand -base64 32)|" .env
          docker compose up -d --build bb84-kme-a bb84-kme-b

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            a=$(docker inspect -f '{{.State.Health.Status}}' bb84-kme-a 2>/dev/null || echo starting)
            b=$(docker inspect -f '{{.State.Health.Status}}' bb84-kme-b 2>/dev/null || echo starting)
            [ "$a" = healthy ] && [ "$b" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs bb84-kme-a bb84-kme-b
          exit 1

      # The single most important contract in the project: if this JSON shape
      # drifts, arnika cannot parse it and the whole hybrid layer breaks.
      - name: Contract tests
        env:
          KME_URL: http://127.0.0.1:18080
          PEER_KME_URL: http://127.0.0.1:18081
          SAE_ID: ALICE
          PEER_SAE_ID: BOB
        run: |
          docker run -d --name kme-a-proxy --network host alpine/socat \
            TCP-LISTEN:18080,fork,reuseaddr TCP:$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{break}}{{end}}' bb84-kme-a):8080
          docker run -d --name kme-b-proxy --network host alpine/socat \
            TCP-LISTEN:18081,fork,reuseaddr TCP:$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{break}}{{end}}' bb84-kme-b):8080
          sleep 3
          pytest tests/test_etsi014_contract.py -v

      # SimQN and SeQUeNCe are listed as COMMENTS in
      # services/bb84-kme/requirements.txt ("pulled in via submodule install in
      # Dockerfile"), so `pip install -r` never gets them and the `python` job
      # cannot run anything that imports them. No job ran pytest inside the
      # bb84-kme image either, so five physics assertions executed nowhere:
      #
      #   test_backend_cross_qber.py::test_backend_keys_match_lo_ma_qber[simqn]
      #   test_sequence_backend_actually_uses_sequence.py::test_the_noise_is_sampled_not_fixed
      #   test_sequence_backend_actually_uses_sequence.py::test_the_mean_agrees_with_the_analytical_qber
      #   test_skr_is_not_a_sifting_ratio.py::test_backend_reports_the_shared_rate[simqn]
      #   test_skr_is_not_a_sifting_ratio.py::test_simqn_flags_synthesised_rounds
      #
      # Read out of the real `python` job log on main, not inferred. The cost
      # is that test_backend_cross_qber.py calls itself "the canonical guard
      # against backend drift" while only the qutip arm ran -- a cross-check
      # between two independent models degenerating to one model against the
      # analytic formula it is supposed to be independent of.
      #
      # This job already builds and starts that image, so running them here
      # costs one `docker run`. Mirrors what `images` does for liboqs.
      #
      # A bare `git submodule update --init` would NOT lift the skip:
      # simqn_backend.py resolves the package from $SIMQN_PATH or a
      # container-absolute path, and the Dockerfile installs both with
      # `pip install -e /opt/SimQN` and `-e /opt/SeQUeNCe`.
      - name: Backend physics inside the image that has SimQN and SeQUeNCe
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            --entrypoint sh pqcqkd/bb84-kme:local -c '
              pip install --quiet --no-cache-dir pytest pytest-asyncio || exit 1
              cd /repo && python -m pytest \
                tests/test_backend_cross_qber.py \
                tests/test_sequence_backend_actually_uses_sequence.py \
                tests/test_skr_is_not_a_sifting_ratio.py \
                -v -p no:cacheprovider -o cache_dir=/tmp/pytest-cache \
                2>&1 | tee /tmp/out
              # A skip here means the image lost a dependency it is built to
              # carry, which is the condition this step exists to detect. It
              # must fail rather than report green on nothing.
              if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/out; then
                echo "::error::backend physics skipped INSIDE the image; SimQN or SeQUeNCe is missing from it"
                exit 1
              fi
            '

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail 200

  ipsec:
    name: strongSwan lane — two-node IKEv2 with ML-KEM and RFC 8784 PPK
    runs-on: ubuntu-latest
    # Every assertion here corresponds to a defect that shipped because the lane
    # had only ever been exercised on a single node in isolation. A one-node
    # check can confirm that the config renders, the proposal parses and the PPK
    # loads -- and all three passed while the tunnel could not come up at all.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start both IPsec nodes
        run: |
          cp .env.example .env
          sed -i "s|^ARNIKA_PSK=.*|ARNIKA_PSK=$(openssl rand -base64 32)|" .env
          docker compose -f docker-compose.yml -f docker-compose.strongswan.yml \
            --profile ipsec up -d --build alice-ipsec bob-ipsec

      # The tunnel must come up on its own. Nothing here initiates it by hand:
      # an explicit swanctl --initiate would mask exactly the boot-ordering and
      # supervision failures this job exists to catch.
      - name: Wait for the SA to establish on both nodes
        run: |
          for i in $(seq 1 60); do
            a=$(docker exec alice-ipsec swanctl --list-sas 2>/dev/null | grep -c ESTABLISHED || true)
            b=$(docker exec bob-ipsec   swanctl --list-sas 2>/dev/null | grep -c ESTABLISHED || true)
            if [ "$a" -ge 1 ] && [ "$b" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::no IKE_SA established within 300s"
          exit 1

      # A tunnel can be ESTABLISHED with neither the post-quantum key exchange
      # nor the PPK: without ppk_required charon silently falls back to
      # NO_PPK_AUTH, which is the whole thing this project exists to prevent.
      - name: Assert ML-KEM-768 and the PPK are in the negotiated proposal
        run: |
          set -eu
          for node in alice-ipsec bob-ipsec; do
            line=$(docker exec "$node" swanctl --list-sas | grep -m1 'ESTABLISHED' -A3 | grep -m1 'ML_KEM' || true)
            echo "$node: ${line:-<no proposal line>}"
            case "$line" in
              *KE1_ML_KEM_768*) ;;
              *) echo "::error::$node negotiated no ML-KEM-768"; exit 1 ;;
            esac
            case "$line" in
              *"/PPK"*) ;;
              *) echo "::error::$node established without an RFC 8784 PPK"; exit 1 ;;
            esac
          done

      # The PPK ids differ by design (each side namespaces by peer name), so
      # comparing them proves nothing. What proves the two peers derived the
      # SAME key is that reauthentication keeps succeeding under
      # ppk_required = yes -- a mismatch is AUTHENTICATION_FAILED.
      - name: Rotate keys and assert the SA count stays at one
        run: |
          set -eu
          sleep 240
          fail=0
          for node in alice-ipsec bob-ipsec; do
            sas=$(docker exec "$node" swanctl --list-sas | grep -c ESTABLISHED || true)
            authfail=$(docker logs "$node" 2>&1 | grep -cE 'AUTH_FAILED|no PPK found' || true)
            rot=$(docker logs "$node" 2>&1 | grep -c 'PPK rotated' || true)
            echo "$node: $sas SA(s), $rot rotation(s), $authfail auth failure(s)"

            [ "$rot" -ge 2 ] || { echo "::error::$node rotated $rot times, expected >= 2"; fail=1; }
            # NOT -eq 0. Rotating a PPK under a stable PPK_ID cannot be atomic
            # across two hosts: the initiator reauthenticates microseconds after
            # its own load, and the responder's load of the same generation can
            # land a few hundred microseconds later. Measured at 1 failure in 45
            # rotations on a LONG run, self-correcting. Note this job sees only
            # 6-8 rotations in its 240s window, so the ceiling below tolerates
            # ONE failure, not nine. See the "sub-millisecond rotation race"
            # section in docs/vici-ppk.md.
            #
            # Asserting zero would make this job flake, and a flaky guard is one
            # that gets ignored. What must still fail the build is SYSTEMATIC
            # mismatch -- two credentials answering one PPK_ID, which is a coin
            # flip rather than a race. That measured 4 failures in 9 rotations
            # before the bootstrap credential was retired, so a 20% ceiling
            # separates the two cleanly.
            # Print the timeline whenever there is ANY failure, not only when
            # the ceiling trips. A passing run with one or two failures is
            # exactly the data point that discriminates between a startup
            # window and a per-rotation race, and dumping only on failure meant
            # those runs told us nothing. Two local reproductions (7 rotations,
            # 0 failures each) could not produce the condition at all.
            #
            # An earlier version of this comment said the count was "bimodal --
            # 4 or 0, never 1 to 3, identical on both nodes". Withdrawn: the
            # observed series is 0, 0, 1, 4, 8, 4, 2, which is not bimodal. It
            # was pattern-matched from too few samples, and it mattered because
            # "bimodal" implies a switch while a spread implies a race -- the
            # shape of the distribution was doing argumentative work it could
            # not support.
            # UNCONDITIONAL. This dump was guarded by `authfail > 0`, and that
            # guard is why nine observations produced no diagnosis: a run with
            # ZERO failures is precisely the discriminating case, and it
            # printed nothing. Worse, the absence reads as evidence -- a
            # passing run looks like it shows "the bootstrap was never retired"
            # when in truth nothing was dumped at all. Measured that misreading
            # on 2026-08-22 while diagnosing this very assertion.
            # 2026-08-27: this dump finally produced the discriminating data,
            # and it rules out BOTH standing hypotheses. Run 33071519309,
            # 2 failures on each node, aligned by container timestamp:
            #
            #   time      alice-ipsec (drives reauth)   bob-ipsec (responder)
            #   12:28:01  loaded ppk#2, rotate#2 -> OK  loaded ppk#2, rotate#2 -> OK
            #   12:28:31  loaded ppk#3, rotate#3        (nothing at all)
            #                                          MAC mismatched, AUTH_FAILED
            #   12:29:01  loaded ppk#4, rotate#4        (nothing at all)
            #                                          MAC mismatched, AUTH_FAILED
            #   12:29:31  loaded ppk#5, rotate#5 -> OK  loaded ppk#3, rotate#3 -> OK
            #
            # Bob logged NO load, NO rotation and NO invalidation for two whole
            # intervals -- its own counter went 2 -> 3 across 90s while alice's
            # went 2 -> 5. So bob ran ~2 intervals BEHIND, and the MAC mismatch
            # is the CONSEQUENCE (alice authenticating with generation 3 while
            # bob still held 2), not the fault.
            #
            # That is neither of the two hypotheses previously written here. Not
            # a sub-millisecond rotation race: the gap is 60s, not microseconds,
            # and the failures resolve by bob catching up rather than by a
            # retry. Not a systematic mismatch either: rotations 5-8 all
            # succeed with no intervention.
            #
            # What it looks like instead: bob was BACKUP for those intervals and
            # never got the key_id from alice, so it produced no key and logged
            # only `[REQ] BACKUP for interval N, waiting for key_id from peer`
            # -- a line the OLD alternation below did not match, which is why
            # the previous dumps showed a hole rather than a cause.
            #
            # So the alternation now covers arnika's OWN key-acquisition path,
            # not just charon's reaction to it. Every branch that can end an
            # interval without a PSK is listed, from submodules/arnika/main.go
            # and udpserver.go. Note `[STOP] configure random PSK` in
            # particular: on failure arnika deliberately installs a random PPK
            # the peer cannot match, which would produce an identical
            # AUTH_FAILED -- so its presence or absence separates "arnika gave
            # up loudly" from "arnika never ran the interval".
            echo "--- $node: $authfail auth failure(s) in $rot rotations, in context ---"
            docker logs -t "$node" 2>&1 \
              | grep -nE 'AUTH_FAILED|no PPK found|MAC mismatched|tried [0-9]+ shared key|loaded PPK shared key|unloaded shared key|unloaded the bootstrap|unloaded orphaned|PPK rotated|IKE_SA .* established|reauthenticating IKE_SA|\[SND\]|\[RCV\]|\[REQ\]|\[OK\]|\[STOP\]|no ACK after|failed to retrieve QKD key|failed to retrieve PQC key|failed to send key_id|failed to derive key|waiting for key_id|psk mismatch or message corrupted|no QKD key received' \
              | head -200

            if [ $((authfail * 5)) -gt "$rot" ]; then
              echo "::error::$node saw $authfail auth failures in $rot rotations (>20%) -- the peers are systematically resolving different PPKs, not losing a race"
              # Print the evidence. This job used to report only the COUNT, so
              # when it fired there was nothing to diagnose from: two runs on
              # 2026-08-22 reported exactly 4 failures against 6 and then 8
              # rotations, and neither could be placed in time. A constant
              # count across different rotation counts would suggest a fixed
              # STARTUP cost rather than a per-rotation race -- but note that
              # this ratio has no window asymmetry to lean on: $authfail and
              # $rot are both greps of the same unwindowed `docker logs`, so
              # numerator and denominator span the SAME interval, the whole
              # container lifetime, bootstrap included. The `sleep 240` above
              # only decides WHEN the counting runs, not WHAT it counts. The
              # 2026-08-27 timeline further up supersedes the startup guess
              # anyway: the failures were bob lagging alice by two rotation
              # intervals. These lines stay because a count alone still cannot
              # be placed in time.
              echo "--- $node: auth failures in context ---"
              docker logs "$node" 2>&1 | grep -nE 'AUTH_FAILED|no PPK found|unloaded the bootstrap|unloaded orphaned|PPK rotated' | head -40
              fail=1
            fi
            # Two owners for one SA made this climb by one per rotation, and
            # reached 140 before it was found. Allow 2 for a make-before-break
            # reauth caught mid-flight; anything above that is the runaway.
            [ "$sas" -le 2 ] || { echo "::error::$node holds $sas IKE_SAs; expected 1"; fail=1; }
          done
          exit "$fail"

      # Which half of HKDF(QKD || PQC) do the two peers disagree on?
      #
      # On 2026-08-22 the lane was measured failing every QKD-derived
      # reauthentication: "tried 1 shared key for 'bob@pqcqkd.local' -
      # 'alice@pqcqkd.local', but MAC mismatched", 8 times in 8 rotations.
      # Exactly one credential, correct generation, MAC still wrong -- so the
      # two peers hold DIFFERENT 32 bytes. That rules out ordering, id
      # namespacing and a missing credential by observation.
      #
      # It does not say WHICH input differs. arnika derives the PPK as
      # HKDF-SHA3-256(qkd_key || pqc_key) (submodules/arnika/kdf/kdf.go), so
      # exactly one of the two halves must differ, and nothing in the system
      # ever compares them across the pair. This step does.
      #
      # Hashes only -- never key material -- and truncated, so the output
      # identifies agreement/disagreement without disclosing anything useful.
      # Non-fatal by design: it is evidence, not an assertion. Making it fail
      # the build before the mechanism is understood would only add a second
      # red job saying the same thing as the first.
      - name: Which half of HKDF(QKD || PQC) diverges
        if: always()
        run: |
          set -u
          echo "=== PQC half: sha256(/var/lib/rosenpass/pqc.psk), first 24 hex ==="
          for node in alice-ipsec bob-ipsec; do
            h=$(docker exec "$node" sh -c \
                  'sha256sum /var/lib/rosenpass/pqc.psk 2>/dev/null | cut -c1-24' 2>/dev/null || true)
            printf '  %-12s %s\n' "$node" "${h:-<absent or unreadable>}"
          done
          echo "=== QKD half: the key_id exchange, WITH roles ==="
          # Bare ids are not enough. Measured on 2026-08-23: a failing run showed
          # two ids on alice that were absent from bob's list, which looks like
          # the answer -- but the ids alone cannot distinguish "bob never
          # received it" from "the tail cut it off". Only one id carried role
          # context, and that one was healthy:
          #   PRIMARY[11] [SND] send key_id c7f2a948
          #   BACKUP[12]  [RCV] received key_id c7f2a948
          #   BACKUP[12]  [REQ] request QKD key for key_id c7f2a948
          # arnika elects a PRIMARY per interval; it fetches enc_keys, sends the
          # id, and the BACKUP resolves that id via dec_keys. If an id is SND on
          # one node with no matching RCV on the other, the two ends derive from
          # different QKD keys -- which, with the PQC halves byte-identical, is
          # the whole defect. Capture SND/RCV/REQ so the next failure settles it.
          for node in alice-ipsec bob-ipsec; do
            echo "  --- $node"
            docker logs "$node" 2>&1 \
              | grep -aoE '(PRIMARY|BACKUP)\[[0-9]+\].{0,14}\[(SND|RCV|REQ|OK)\].{0,60}key_id [0-9a-f-]{36}' \
              | tail -14 | sed 's/^/      /' || true
            echo "      -- bare ids (fallback if the pattern above misses):"
            docker logs "$node" 2>&1 \
              | grep -aoE 'key_id [0-9a-f-]{36}' | sort -u | tail -10 | sed 's/^/        /' || true
          done
          echo
          echo "Reading it: identical PQC hashes + a shared key_id means both"
          echo "inputs agreed and the divergence is downstream of the KDF."
          echo "Differing PQC hashes localise it to the rosenpass half; a"
          echo "key_id present on one node only localises it to the QKD half."

      - name: Assert traffic actually traverses ESP
        run: |
          set -eu
          docker exec alice-ipsec ping -c 3 -W 2 10.30.0.21
          out=$(docker exec alice-ipsec swanctl --list-sas | grep -m1 'out ')
          echo "$out"
          # A tunnel that is up but installs no ESP counters is passing traffic
          # in the clear past the policy.
          echo "$out" | grep -qE '[1-9][0-9]* bytes' \
            || { echo "::error::no bytes counted on the outbound ESP SA"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          for node in alice-ipsec bob-ipsec; do
            echo "===== $node ====="
            docker logs --tail 200 "$node" 2>&1 || true
            docker exec "$node" swanctl --list-sas 2>&1 || true
            docker exec "$node" ip xfrm policy 2>&1 || true
          done
