name: CI

on:
  push:
    # `main` is the only long-lived branch; feature branches are covered by the
    # pull_request trigger below.
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner and action versions are pinned on purpose.
#
# `runs-on` names ubuntu-24.04 rather than ubuntu-latest: the `latest` label is
# scheduled to move to Ubuntu 26 from 2026-10-19, which would change the system
# Python, the Docker engine and dash under every job without a commit here to
# show for it. Moving to a newer image should be a reviewed diff.
#
# The actions are on their current majors (checkout, setup-python, setup-node
# and setup-go v7, gitleaks-action v3), all of which run on Node 24. The Node 20
# majors printed a deprecation annotation on every run, and Node 20 has been
# removed from GitHub-hosted runners. Release notes were checked for removed
# inputs before the bump: setup-python v7 drops `pip-install` and setup-node v6
# limits automatic caching to npm; neither input is used here, and every
# setup-node step names `cache: npm` explicitly.

jobs:
  python:
    name: Python — lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r services/bb84-kme/requirements.txt
          pip install -r services/webui-backend/requirements.txt

      # No `|| true`: the Makefile targets used to swallow lint failures, so
      # they never gated anything.
      #
      # `ruff format --check` is deliberately NOT run here. The existing code
      # predates the formatter and reformatting it would be a ~38-file
      # cosmetic diff; that is worth doing as its own change, not as a gate
      # that fails every PR until someone does it.
      #
      # scripts/ is linted too: it carries Python (the published-text scanner
      # and the PPK outcome report), and an unlinted directory is where an
      # undefined name survives until the one run that needs it.
      - name: Lint
        run: ruff check services/ tests/ tools/ benchmarks/ scripts/

      # Three of the fourteen submodules, shallowly -- not `submodules:
      # recursive`. Each is here because a guard DERIVES a claim from it and
      # self-skips without it, which meant the guard was silent in the only job
      # that runs it:
      #
      #   rosenpass                    the KEM names come from the pinned
      #                                domain-separation label
      #   tno-qkd-key-rate             the independent-engine cross-check reads
      #                                the upstream bb84.py it compares against
      #                                (536K shallow)
      #   qkd-pqc-paper-supplementary  the units guard reads the real CSV
      #                                headers, so an upstream column rename is
      #                                what makes it fail (1.7M shallow)
      #
      # strongswan is deliberately NOT added: it is 183 MB, and the `go` job
      # already checks it out recursively, so the notify-payload guard runs
      # there instead of making every push pay for it twice.
      - name: Check out the pinned submodules the guards derive from
        run: |
          git submodule update --init --depth 1 \
            submodules/rosenpass \
            submodules/tno-qkd-key-rate \
            submodules/qkd-pqc-paper-supplementary

      # benchmarks/results/ is gitignored, so this artefact never exists on a
      # fresh checkout and all four guards in
      # tests/test_paper_comparison_says_what_it_averaged.py skipped -- the file
      # was inert in CI and ran only on a developer machine that happened to
      # have generated it once.
      #
      # Generating it here is also the stronger test: the guards then run
      # against the REAL upstream CSV headers, which is the thing that can
      # change under us. `ours` is legitimately absent (no handshake_age.csv is
      # produced in CI) and the producer records that as n=0 WITH a note --
      # which is exactly the distinction the third guard checks.
      - name: Generate the paper comparison the units guards read
        run: python tools/compare_to_paper.py

      # tests/test_paper_budgets.py reads the redistributed paper PDF with
      # `pdftotext` and skips its two PDF assertions (one table, numbered 1;
      # the budgets printed in it) when the binary is absent. Installed here
      # rather than assumed from the runner image, so those two run.
      - name: Install pdftotext for the paper PDF guards
        run: |
          sudo apt-get update -q
          sudo apt-get install -y poppler-utils

      # Contract tests self-skip without a live KME; the `live-stack` job runs
      # them for real.
      - name: Unit tests
        run: pytest tests/ -v

  keyrate:
    name: Key-rate model — golden vector and port parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/webui-frontend/package-lock.json

      - run: pip install pytest pytest-asyncio numpy pyyaml
      - run: npm ci
        working-directory: services/webui-frontend

      # Pins the model to published values (Ma et al. 2005, GYS worked example:
      # R = 2.555e-3 bits/pulse) and checks the TypeScript port still agrees
      # with the Python reference. The same model is implemented three times in
      # this repo, so drift is a real risk.
      - name: Golden vector and cross-implementation parity
        run: pytest tests/test_keyrate_golden_vector.py tests/test_keyrate_ports_agree.py -v

  frontend:
    name: Frontend — typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/webui-frontend/package-lock.json

      - run: npm ci
        working-directory: services/webui-frontend

      # `npm run build` was `vite build` alone for a long time, so type errors
      # accumulated unnoticed. tsc is part of the build now; this makes it a gate.
      - name: Typecheck
        run: npm run typecheck
        working-directory: services/webui-frontend

      # The BB84 channel replay and the key-pool model had no test of any kind
      # until vitest was added -- the frontend carries real simulation code, so
      # "it compiles" was never enough of a gate.
      - name: Unit tests
        run: npm test
        working-directory: services/webui-frontend

      - name: Build
        run: npx vite build
        working-directory: services/webui-frontend

  go:
    name: arnika VICI adapter — vet, build, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          # arnika hardens key material with runtime/secret, which needs 1.26.
          go-version: "1.26"
          # The module cache is keyed on a go.sum, and by default setup-go looks
          # for one at the repository root. There is none -- the only Go module
          # built here is the pinned arnika tree -- so the cache restore failed
          # with a warning on every run and never saved anything. arnika's own
          # go.sum is the right key: build.sh builds that module, adding only
          # govici on top.
          cache-dependency-path: submodules/arnika/go.sum

      # setup-python rather than the runner's system interpreter: Ubuntu 24.04
      # marks that one externally-managed (PEP 668), so a bare `pip install`
      # into it exits non-zero. It sits before the FIRST Python step of this
      # job, so every guard below runs on the same interpreter; it used to sit
      # before the last one, leaving the first two on the runner's own.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Builds the adapter against the pinned upstream arnika tree exactly as
      # nodes/strongswan/Dockerfile does, so the image build cannot be the
      # first place a compile error shows up.
      # Build, vet and test all run inside the tree build.sh assembles.
      #
      # -tags strongswan_vici is required, not decorative: the wiring file
      # services/arnika-vici/wire_strongswan_vici.go carries that build
      # constraint, so without it the adapter selector -- including the
      # VICI_IKE_ROLE validation that decides which peer owns the IKE_SA -- is
      # excluded from both vet and test. But the tag only compiles once build.sh
      # has narrowed upstream's wire_wireguard_netlink.go; otherwise both wiring
      # files define getKeyWriterService. That is why this is one step and not
      # two: a separate step with its own copy of the overlay drifted from
      # build.sh and vetted an unpatched tree.
      #
      # The layout is upstream PR #51's (the pin is its head, f4cf9ba): one
      # package per adapter, so the adapter itself is
      # services/arnika-vici/repositories/swanvici/ and implements the one-method
      # port SetPSK([]byte). build.sh stops with FATAL if upstream already ships
      # either overlaid file, rather than silently replacing it.
      - name: Build, vet and test with the strongswan_vici adapter
        env:
          ARNIKA_VICI_VET_AND_TEST: "1"
        run: sh services/arnika-vici/build.sh submodules/arnika services/arnika-vici /tmp/arnika-vici

      # Runs HERE and not in `python` because it needs the arnika tree: it
      # derives the set of writers from the files that actually define
      # getKeyWriterService, rather than hardcoding a list that would go stale
      # the next time upstream adds an adapter. In `python` it would self-skip
      # and go green having asserted nothing -- which
      # tests/test_no_guard_is_inert_in_ci.py reported when this file was first
      # added, before it was placed here.
      - name: The build-tag narrowing excludes every writer, not just the known ones
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_the_build_tag_narrowing_is_exhaustive.py -q

      # Same reason, same tree. At the pin the PQC half of the PSK is agreed by
      # arnika itself over PQC-HPKE; the Rosenpass file handover
      # (PQC_PSK_FILE) is gone upstream. This fails if the pinned tree stops
      # offering PQC_ENABLED or loses repositories/pqchpke/, if anything in
      # the deployment still sets PQC_PSK_FILE (a variable nothing reads), or
      # if the two peers of a pair disagree on MODE or PQC_ENABLED, which the
      # pinned arnika requires to be identical on both ends. The compose half
      # needs pyyaml, which this job does not otherwise install.
      #
      # tests/test_ppk_race_report.py runs here for the same reason: besides
      # its synthetic fixtures, it checks that the message strings
      # scripts/ppk_race_report.py keys on are still written by the pinned
      # arnika and the pinned charon, and both trees are only checked out here.
      #
      # So does tests/test_entrypoints_validate_their_input.py. Most of it
      # runs the entrypoints' checks under bash and needs no submodule, but
      # the entrypoint comments cite line ranges of the pinned main.go, and
      # the test that those ranges still hold the cited code skips without the
      # arnika tree. The `python` job runs the whole suite without that tree,
      # so there the test would go green having asserted nothing, which
      # tests/test_no_guard_is_inert_in_ci.py reports.
      - name: The PQC half comes from the pinned arnika, and the report reads its logs
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest tests/test_pqc_half_comes_from_the_pinned_arnika.py tests/test_ppk_race_report.py tests/test_entrypoints_validate_their_input.py -q

      # Same tree again: /keyflow quotes arnika's HKDF call as code, and this
      # fails when a quoted line is no longer in the pinned kdf/kdf.go.
      - name: The /keyflow page quotes the pinned arnika KDF verbatim
        run: |
          python3 -m pytest tests/test_keyflow_quotes_the_pinned_kdf.py -q

      # This guard derives its claims from two pinned trees -- strongSwan's
      # notify_payload.h (which Status Types exist, and that 16444 is still the
      # highest) plus ike_auth.c (that `ppk_required` is enforced on the
      # INITIATOR, which it was not before 6.1.0), and arnika's kdf.go (the exact
      # HKDF call the SP 800-227 analysis is written against). Without them it
      # self-skips, and the `python` job that runs the rest of tests/ checks out
      # neither.
      #
      # It lives here rather than there because this job has already paid for
      # `submodules: recursive`; adding 183 MB of strongSwan to the Python job
      # to run six assertions would cost every push far more than a pip
      # install of pytest costs this one.
      #
      # pytest-asyncio is not used by this file. It is installed because
      # pytest.ini sets asyncio_mode and asyncio_default_fixture_loop_scope for
      # the suite as a whole, and without the plugin pytest prints two
      # "Unknown config option" warnings on every run of this job -- noise that
      # would camouflage a real warning later. Verified with a pytest-only
      # virtualenv first: the file passes either way, so this is for the log,
      # not for correctness.
      - name: Claims derived from the pinned strongSwan and arnika trees
        run: |
          python -m pip install --quiet pytest pytest-asyncio
          python -m pytest tests/test_claims_about_the_pinned_strongswan_hold.py -v

  env-example:
    name: Example env files satisfy the compose set
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Compose interpolates the ENTIRE file before selecting services, so a
      # missing ${VAR:?} aborts an `up` that names only unrelated ones. A
      # mandatory variable absent from the example file operators are told to
      # copy is therefore a total deploy failure, and it was one: the public
      # demo sat on a two-month-old build because deploy/.env.example never
      # listed ARNIKA_PSK.
      - name: Check
        run: sh scripts/check_env_example.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans committed content for credentials (keys, tokens, private keys).
      # gitleaks reads the git history, not only the checked-out tree, which is
      # why the checkout above fetches it in full (`fetch-depth: 0`, as the
      # action's own example sets it).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit MESSAGES are published alongside the tree, and gitleaks does not
      # read them. Once pushed they cannot be corrected without rewriting a
      # published branch, so the check belongs on the way in rather than in a
      # later audit that can only report what is already public.
      #
      # The patterns are not restated here. scripts/scan_published_text.py
      # applies the matchers the tracked-content guards already use -- tooling
      # words, the demo host and public addresses, and the hashed private-file
      # names, which cannot be written into this file without disclosing them
      # -- plus the operator's numbered working notes, matched by digest in the
      # same way. It refuses every Co-authored-by trailer on purpose (this
      # repository has one author). It prints the commit and the category,
      # never the matched text, because this log is public too.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      #
      # The event values arrive through env rather than being pasted into the
      # script by `${{ }}`, so a ref name is data to the shell, never code.
      - name: Commit messages disclose no tooling, private file or host
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          # pytest only because the shared pattern module is a test module.
          python -m pip install --quiet pytest

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python scripts/scan_published_text.py --git-range "origin/${BASE_REF}..HEAD"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            python scripts/scan_published_text.py --git-range "${BEFORE}..${AFTER}"
          else
            # "before" is not a commit in this checkout, so "before..after" is
            # not a range git can resolve and the step used to fail on it
            # instead of scanning. Two ways to get here:
            #
            #   - a forced push that rewrote history: "before" is the old tip,
            #     which the rewrite made unreachable from every ref the checkout
            #     fetched. The push run after the history rewrite of 2026-09-26
            #     failed exactly here.
            #   - the first push of a branch, which reports an all-zero
            #     "before". The old fallback scanned only HEAD~1..HEAD there,
            #     so every earlier commit of a new branch went unread.
            #
            # In both cases nothing says which commits are new, so every one is
            # scanned: --all-commits reads each commit reachable from the refs
            # this full-depth checkout fetched, which includes all of HEAD's
            # history. A rewritten history is published in full, so scanning
            # all of it is the check the push actually needs.
            echo "push 'before' ${BEFORE} is not in this checkout (forced push or new branch); scanning every commit"
            python scripts/scan_published_text.py --all-commits
          fi

      # A pull request's title and body are published beside the tree too, and
      # neither gitleaks nor the step above reads them. Same matchers, same rule
      # of printing the category and never the matched text.
      #
      # Both values reach the script through env and then stdin, and are never
      # pasted into it with `${{ }}`: on a pull request from a fork the title
      # and body are text anyone can write, and interpolated into `run:` they
      # would be shell code.
      #
      # `!cancelled()` instead of the default success(), so a finding in a
      # commit message above does not hide one in the pull-request text.
      #
      # Coverage: `pull_request` without `types:` runs on opened, synchronize
      # and reopened. Editing only the title or body starts no run, so text
      # edited after the last push is read at the next push.
      - name: Pull-request title and body disclose no tooling, private file or host
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          # pytest only because the shared pattern module is a test module.
          python -m pip install --quiet pytest
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" \
            | python scripts/scan_published_text.py --label "pr text"

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The strongSwan image previously could not build at all (it COPY'd a
      # liboqs lib64 directory that is never created on Debian) and nothing
      # noticed, because no job ever built it.
      - name: strongSwan node
        run: docker build -f nodes/strongswan/Dockerfile -t pqcqkd/strongswan:ci .

      # ML-KEM must be reachable at runtime, not merely compiled: the plugin
      # also has to be named in charon's `load` line. Assert it end-to-end.
      - name: ML-KEM-768 is available to charon
        run: |
          docker run --rm --cap-add NET_ADMIN --entrypoint sh pqcqkd/strongswan:ci -c '
            /usr/local/libexec/ipsec/charon 2>/dev/null &
            for i in $(seq 1 30); do [ -S /var/run/charon.vici ] && break; sleep 1; done
            swanctl --list-algs | grep -q "ML_KEM_768" \
              || { echo "FATAL: ML_KEM_768 not available"; swanctl --list-algs; exit 1; }
            echo "OK: $(swanctl --list-algs | grep ML_KEM_768)"
          '

      - name: WireGuard node
        run: docker build -f nodes/alice/Dockerfile -t pqcqkd/node-alice:ci .

      # Nothing built this image, which is how it stayed broken: its
      # liboqs-python pin became unsatisfiable on PyPI and nobody noticed until
      # a deploy tried to rebuild. The Dockerfile ends with an ML-KEM-768
      # roundtrip and an ML-DSA-65 sign/verify, so a green build here is also a
      # statement that the post-quantum primitives actually work in the image.
      - name: PQC validator
        run: docker build -f services/pqc-validator/Dockerfile -t pqcqkd/pqc-validator:ci .

      # The interop cross-check needs liboqs, which the host job does not have,
      # so those tests skip there and would give false assurance. Run them where
      # liboqs exists by construction -- inside the image that ships it.
      # The whole repo is mounted, not just tests/: conftest.load_service_app
      # resolves `services/<name>/app` relative to the repo root, and mounting
      # tests/ alone made that path absent inside the image.
      - name: ML-KEM interoperability cross-check (inside the image)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            --entrypoint sh pqcqkd/pqc-validator:ci -c '
              pip install --quiet --no-cache-dir pytest httpx || exit 1
              cd /repo && python -m pytest \
                tests/test_pqc_interop_is_a_real_crosscheck.py \
                tests/test_mlkem_kat_matches_liboqs.py \
                tests/test_agility_matrix_spans_two_families.py \
                -q -p no:cacheprovider -o cache_dir=/tmp/pytest-cache
            '

  live-stack:
    name: ETSI GS QKD 014 and 004 contract tests (live KMEs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio httpx

      # Off in the shipped config (nothing on the public demo drives it). The
      # grep fails the step if the sed matched nothing, so a renamed key cannot
      # leave the 004 contract skipping here.
      - name: Switch the ETSI GS QKD 004 binding on
        run: |
          sed -i 's/^  endpoint_enabled: false$/  endpoint_enabled: true/' config/qkd_params.yaml
          grep -q '^  endpoint_enabled: true$' config/qkd_params.yaml

      - name: Start the two KMEs
        run: |
          cp .env.example .env
          sed -i "s|^ARNIKA_PSK=.*|ARNIKA_PSK=$(openssl rand -base64 32)|" .env
          docker compose up -d --build bb84-kme-a bb84-kme-b

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            a=$(docker inspect -f '{{.State.Health.Status}}' bb84-kme-a 2>/dev/null || echo starting)
            b=$(docker inspect -f '{{.State.Health.Status}}' bb84-kme-b 2>/dev/null || echo starting)
            [ "$a" = healthy ] && [ "$b" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs bb84-kme-a bb84-kme-b
          exit 1

      # The single most important contract in the project: if this JSON shape
      # drifts, arnika cannot parse it and the whole hybrid layer breaks.
      - name: Contract tests
        env:
          KME_URL: http://127.0.0.1:18080
          PEER_KME_URL: http://127.0.0.1:18081
          SAE_ID: ALICE
          PEER_SAE_ID: BOB
          # A disabled 004 binding fails here instead of skipping.
          ETSI004_REQUIRED: "1"
        run: |
          docker run -d --name kme-a-proxy --network host alpine/socat \
            TCP-LISTEN:18080,fork,reuseaddr TCP:$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{break}}{{end}}' bb84-kme-a):8080
          docker run -d --name kme-b-proxy --network host alpine/socat \
            TCP-LISTEN:18081,fork,reuseaddr TCP:$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{break}}{{end}}' bb84-kme-b):8080
          sleep 3
          pytest tests/test_etsi014_contract.py tests/test_etsi004_contract.py -v

      # SimQN and SeQUeNCe are listed as COMMENTS in
      # services/bb84-kme/requirements.txt ("pulled in via submodule install in
      # Dockerfile"), so `pip install -r` never gets them and the `python` job
      # cannot run anything that imports them. No job ran pytest inside the
      # bb84-kme image either, so five physics assertions executed nowhere:
      #
      #   test_backend_cross_qber.py::test_backend_keys_match_lo_ma_qber[simqn]
      #   test_sequence_backend_actually_uses_sequence.py::test_the_noise_is_sampled_not_fixed
      #   test_sequence_backend_actually_uses_sequence.py::test_the_mean_agrees_with_the_analytical_qber
      #   test_skr_is_not_a_sifting_ratio.py::test_backend_reports_the_shared_rate[simqn]
      #   test_skr_is_not_a_sifting_ratio.py::test_simqn_flags_synthesised_rounds
      #
      # Read out of the real `python` job log on main, not inferred. The cost
      # is that test_backend_cross_qber.py calls itself "the canonical guard
      # against backend drift" while only the qutip arm ran -- a cross-check
      # between two independent models degenerating to one model against the
      # analytic formula it is supposed to be independent of.
      #
      # This job already builds and starts that image, so running them here
      # costs one `docker run`. Mirrors what `images` does for liboqs.
      #
      # A bare `git submodule update --init` would NOT lift the skip:
      # simqn_backend.py resolves the package from $SIMQN_PATH or a
      # container-absolute path, and the Dockerfile installs both with
      # `pip install -e /opt/SimQN` and `-e /opt/SeQUeNCe`.
      - name: Backend physics inside the image that has SimQN and SeQUeNCe
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            --entrypoint sh pqcqkd/bb84-kme:local -c '
              pip install --quiet --no-cache-dir pytest pytest-asyncio || exit 1
              cd /repo && python -m pytest \
                tests/test_backend_cross_qber.py \
                tests/test_sequence_backend_actually_uses_sequence.py \
                tests/test_skr_is_not_a_sifting_ratio.py \
                -v -p no:cacheprovider -o cache_dir=/tmp/pytest-cache \
                2>&1 | tee /tmp/out
              # A skip here means the image lost a dependency it is built to
              # carry, which is the condition this step exists to detect. It
              # must fail rather than report green on nothing.
              if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/out; then
                echo "::error::backend physics skipped INSIDE the image; SimQN or SeQUeNCe is missing from it"
                exit 1
              fi
            '

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail 200

  ipsec:
    name: strongSwan lane — two-node IKEv2 with ML-KEM and RFC 8784 PPK
    runs-on: ubuntu-24.04
    # Every assertion here corresponds to a defect that shipped because the lane
    # had only ever been exercised on a single node in isolation. A one-node
    # check can confirm that the config renders, the proposal parses and the PPK
    # loads -- and all three passed while the tunnel could not come up at all.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Start both IPsec nodes
        run: |
          cp .env.example .env
          sed -i "s|^ARNIKA_PSK=.*|ARNIKA_PSK=$(openssl rand -base64 32)|" .env
          docker compose -f docker-compose.yml -f docker-compose.strongswan.yml \
            --profile ipsec up -d --build alice-ipsec bob-ipsec

      # The tunnel must come up on its own. Nothing here initiates it by hand:
      # an explicit swanctl --initiate would mask exactly the boot-ordering and
      # supervision failures this job exists to catch.
      - name: Wait for the SA to establish on both nodes
        run: |
          for i in $(seq 1 60); do
            a=$(docker exec alice-ipsec swanctl --list-sas 2>/dev/null | grep -c ESTABLISHED || true)
            b=$(docker exec bob-ipsec   swanctl --list-sas 2>/dev/null | grep -c ESTABLISHED || true)
            if [ "$a" -ge 1 ] && [ "$b" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::no IKE_SA established within 300s"
          exit 1

      # A tunnel can be ESTABLISHED with neither the post-quantum key exchange
      # nor the PPK: without ppk_required charon silently falls back to
      # NO_PPK_AUTH, which is the whole thing this project exists to prevent.
      # The expected ML-KEM parameter set is read from the IKE proposal the
      # overlay configures rather than written here a second time, so a change
      # of parameter set is asserted against what was configured instead of
      # failing on a stale literal. The sed must match exactly one token; an
      # empty result fails the step rather than asserting on nothing.
      - name: Assert the configured ML-KEM and the PPK are in the negotiated proposal
        run: |
          set -eu
          size=$(sed -n 's/^  IKE_PROPOSALS: .*-ke1_mlkem\([0-9][0-9]*\)$/\1/p' docker-compose.strongswan.yml)
          [ -n "$size" ] || { echo "::error::no ke1_mlkem<N> in IKE_PROPOSALS of docker-compose.strongswan.yml"; exit 1; }
          want="KE1_ML_KEM_${size}"
          for node in alice-ipsec bob-ipsec; do
            line=$(docker exec "$node" swanctl --list-sas | grep -m1 'ESTABLISHED' -A3 | grep -m1 'ML_KEM' || true)
            echo "$node: ${line:-<no proposal line>}"
            case "$line" in
              *"$want"*) ;;
              *) echo "::error::$node negotiated no ${want}"; exit 1 ;;
            esac
            case "$line" in
              *"/PPK"*) ;;
              *) echo "::error::$node established without an RFC 8784 PPK"; exit 1 ;;
            esac
          done

      # The PPK ids differ by design (each side namespaces by peer name), so
      # comparing them proves nothing. What proves the two peers derived the
      # SAME key is that reauthentication keeps succeeding under
      # ppk_required = yes -- a mismatch is AUTHENTICATION_FAILED.
      - name: Rotate keys and assert the SA count stays at one
        run: |
          set -eu
          sleep 240
          fail=0
          for node in alice-ipsec bob-ipsec; do
            sas=$(docker exec "$node" swanctl --list-sas | grep -c ESTABLISHED || true)
            authfail=$(docker logs "$node" 2>&1 | grep -cE 'AUTH_FAILED|no PPK found' || true)
            rot=$(docker logs "$node" 2>&1 | grep -c 'PPK rotated' || true)
            # Every PPK write logs `PPK rotated`, including the random PPK arnika
            # writes when it fails closed: `configuring a random PSK to
            # invalidate` at f4cf9ba (after `no key_id from the peer`, `the
            # peer did not confirm the key_id` and the other failure paths),
            # `configure random PSK to invalidate` at the previous pin. The
            # gates below count writes, as they did at the previous pin, so
            # they apply the same rule at both pins. The effect need not be
            # the same: at f4cf9ba invalidation writes can be more frequent
            # (f4cf9ba adds fail-closed paths, such as a BACKUP interval
            # without a key_id, that the previous pin did not have), and every
            # such write enlarges the denominator, so the ratio gate can be
            # slightly looser there. That rests on the code and one short
            # local run, not on a measurement of this job. The invalidations
            # are printed beside the writes, and the report step below
            # separates key-driven rotations from them.
            inval=$(docker logs "$node" 2>&1 | grep -cE 'configur(e|ing) (a )?random PSK to invalidate' || true)
            echo "$node: $sas SA(s), $rot PPK write(s), $inval invalidation(s), $authfail auth failure(s)"

            [ "$rot" -ge 2 ] || { echo "::error::$node wrote $rot PPKs, expected >= 2"; fail=1; }
            # NOT -eq 0. Rotating a PPK under a stable PPK_ID cannot be atomic
            # across two hosts: the initiator reauthenticates microseconds after
            # its own load, and the responder's load of the same generation can
            # land milliseconds later. Measured at 1 failure in 45 rotations on a
            # LONG two-node run, and 16 in 25,249 over 8.8 days on the live demo
            # (strongSwan 6.1.0); self-correcting. Note this job sees only
            # 6-8 rotations in its 240s window, so the ceiling below tolerates
            # ONE failure, not nine. See "the rotation race" in
            # docs/vici-ppk.md.
            #
            # Asserting zero would make this job flake, and a flaky guard is one
            # that gets ignored. What must still fail the build is SYSTEMATIC
            # mismatch -- two credentials answering one PPK_ID, which is a coin
            # flip rather than a race. That measured 4 failures in 9 rotations
            # before the bootstrap credential was retired, so a 20% ceiling
            # separates the two cleanly.
            # Print the timeline whenever there is ANY failure, not only when
            # the ceiling trips. A passing run with one or two failures is
            # exactly the data point that discriminates between a startup
            # window and a per-rotation race, and dumping only on failure meant
            # those runs told us nothing. Two local reproductions (7 rotations,
            # 0 failures each) could not produce the condition at all.
            #
            # An earlier version of this comment said the count was "bimodal --
            # 4 or 0, never 1 to 3, identical on both nodes". Withdrawn: the
            # observed series is 0, 0, 1, 4, 8, 4, 2, which is not bimodal. It
            # was pattern-matched from too few samples, and it mattered because
            # "bimodal" implies a switch while a spread implies a race -- the
            # shape of the distribution was doing argumentative work it could
            # not support.
            # UNCONDITIONAL. This dump was guarded by `authfail > 0`, and that
            # guard is why nine observations produced no diagnosis: a run with
            # ZERO failures is precisely the discriminating case, and it
            # printed nothing. Worse, the absence reads as evidence -- a
            # passing run looks like it shows "the bootstrap was never retired"
            # when in truth nothing was dumped at all. Measured that misreading
            # on 2026-08-22 while diagnosing this very assertion.
            # 2026-08-27: this dump finally produced the discriminating data,
            # and it rules out BOTH standing hypotheses. Run 33071519309,
            # 2 failures on each node, aligned by container timestamp:
            #
            #   time      alice-ipsec (drives reauth)   bob-ipsec (responder)
            #   12:28:01  loaded ppk#2, rotate#2 -> OK  loaded ppk#2, rotate#2 -> OK
            #   12:28:31  loaded ppk#3, rotate#3        (nothing at all)
            #                                          MAC mismatched, AUTH_FAILED
            #   12:29:01  loaded ppk#4, rotate#4        (nothing at all)
            #                                          MAC mismatched, AUTH_FAILED
            #   12:29:31  loaded ppk#5, rotate#5 -> OK  loaded ppk#3, rotate#3 -> OK
            #
            # Bob logged NO load, NO rotation and NO invalidation for two whole
            # intervals -- its own counter went 2 -> 3 across 90s while alice's
            # went 2 -> 5. So bob ran ~2 intervals BEHIND, and the MAC mismatch
            # is the CONSEQUENCE (alice authenticating with generation 3 while
            # bob still held 2), not the fault.
            #
            # That is neither of the two hypotheses previously written here. Not
            # the rotation race: the gap is 60s, not milliseconds, and the
            # failures resolve by bob catching up. Not a systematic mismatch either: rotations 5-8 all
            # succeed with no intervention.
            #
            # What it looks like instead: bob was BACKUP for those intervals and
            # never got the key_id from alice, so it produced no key and logged
            # only `[REQ] BACKUP for interval N, waiting for key_id from peer`
            # -- a line the OLD alternation below did not match, which is why
            # the previous dumps showed a hole rather than a cause.
            #
            # So the alternation now covers arnika's OWN key-acquisition path,
            # not just charon's reaction to it. Every branch that can end an
            # interval without a PSK is listed. Note the invalidation line in
            # particular: on failure arnika deliberately installs a random PPK
            # the peer cannot match, which would produce an identical
            # AUTH_FAILED -- so its presence or absence separates "arnika gave
            # up loudly" from "arnika never ran the interval".
            #
            # The pin is upstream PR #51's head (f4cf9ba), which logs through
            # log/slog as key=value records, so the pin-era bracketed tags quoted
            # above never appear any more. The alternation lists both vocabularies:
            #
            #   charon and the VICI adapter (unchanged; the adapter still logs
            #   through log.Printf, which the slog bridge wraps into msg="...")
            #     AUTH_FAILED ... reauthenticating IKE_SA
            #   arnika at 3a8cc13, the previous pin (kept so a rollback's logs
            #   still read)
            #     [SND] [RCV] [REQ] [OK] [STOP], no ACK after, failed to send
            #     key_id, waiting for key_id, psk mismatch or message corrupted
            #   arnika at f4cf9ba, each string read from its source
            #     main.go             requesting a new QKD key, serving this
            #                         interval, sending the key_id to the peer,
            #                         requesting the QKD key for the peer's
            #                         key_id (the apostrophe is matched by `.`,
            #                         because this script is single-quoted),
            #                         the peer did not confirm the key_id,
            #                         waiting for a key_id, no key_id from the
            #                         peer, the KMS returned an empty key_id,
            #                         configuring a random PSK to invalidate,
            #                         failed to retrieve, failed to derive,
            #                         failed to configure, no key material,
            #                         falling back to the, PQC-only PSK,
            #                         HKDF derivation completed, PSK configured
            #                         on WireGuard interface
            #     transport/server.go received a key_id from the peer, packet
            #                         rejected, QKD queue full, PQC frame not
            #                         accepted
            #     repositories/pqchpke/pqchpke.go
            #                         round agreed (a fresh PQC key, or a newer
            #                         round already published), round failed,
            #                         round abandoned, round is behind,
            #                         startup round did not complete
            #   `no QKD key received` is in both vocabularies.
            #
            # The cap is a named count, not a guess: about 12 lines match per
            # rotation interval per node (the role line, the key_id lines, the
            # derivation, the PQC round, the PPK load, unload, reauth and
            # establishment), and the job lasts under 20 intervals (at most
            # 300 s to establish plus the 240 s sleep, at INTERVAL 30 s). The
            # previous cap of 200 fitted the pin-era vocabulary and would cut
            # the tail of a run now, which is exactly where the interesting
            # interval tends to be.
            max_lines=400
            echo "--- $node: $authfail auth failure(s) in $rot PPK writes, in context ---"
            docker logs -t "$node" 2>&1 \
              | grep -nE 'AUTH_FAILED|no PPK found|MAC mismatched|tried [0-9]+ shared key|loaded PPK shared key|unloaded shared key|unloaded the bootstrap|unloaded orphaned|PPK rotated|IKE_SA .* established|reauthenticating IKE_SA|\[SND\]|\[RCV\]|\[REQ\]|\[OK\]|\[STOP\]|no ACK after|failed to send key_id|waiting for key_id|psk mismatch or message corrupted|no QKD key received|requesting a new QKD key|serving this interval|sending the key_id to the peer|received a key_id from the peer|requesting the QKD key for the peer.s key_id|the peer did not confirm the key_id|waiting for a key_id|no key_id from the peer|the KMS returned an empty key_id|configuring a random PSK to invalidate|failed to retrieve|failed to derive|failed to configure|no key material|falling back to the|PQC-only PSK|HKDF derivation completed|PSK configured on WireGuard interface|packet rejected|QKD queue full|PQC frame not accepted|round agreed|round failed|round abandoned|round is behind|startup round did not complete' \
              | head -n "$max_lines"

            if [ $((authfail * 5)) -gt "$rot" ]; then
              echo "::error::$node saw $authfail auth failures in $rot PPK writes (>20%) -- the peers are systematically resolving different PPKs, not losing a race"
              # Print the evidence. This job used to report only the COUNT, so
              # when it fired there was nothing to diagnose from: two runs on
              # 2026-08-22 reported exactly 4 failures against 6 and then 8
              # rotations, and neither could be placed in time. A constant
              # count across different rotation counts would suggest a fixed
              # STARTUP cost rather than a per-rotation race -- but note that
              # this ratio has no window asymmetry to lean on: $authfail and
              # $rot are both greps of the same unwindowed `docker logs`, so
              # numerator and denominator span the SAME interval, the whole
              # container lifetime, bootstrap included. The `sleep 240` above
              # only decides WHEN the counting runs, not WHAT it counts. The
              # 2026-08-27 timeline further up supersedes the startup guess
              # anyway: the failures were bob lagging alice by two rotation
              # intervals. These lines stay because a count alone still cannot
              # be placed in time.
              echo "--- $node: auth failures in context ---"
              docker logs "$node" 2>&1 | grep -nE 'AUTH_FAILED|no PPK found|unloaded the bootstrap|unloaded orphaned|PPK rotated' | head -40
              fail=1
            fi
            # Two owners for one SA made this climb by one per rotation, and
            # reached 140 before it was found. Allow 2 for a make-before-break
            # reauth caught mid-flight; anything above that is the runaway.
            [ "$sas" -le 2 ] || { echo "::error::$node holds $sas IKE_SAs; expected 1"; fail=1; }
          done
          exit "$fail"

      # Which half of HKDF(QKD || PQC) do the two peers disagree on?
      #
      # On 2026-08-22 the lane was measured failing every QKD-derived
      # reauthentication: "tried 1 shared key for 'bob@pqcqkd.local' -
      # 'alice@pqcqkd.local', but MAC mismatched", 8 times in 8 rotations.
      # Exactly one credential, correct generation, MAC still wrong -- so the
      # two peers hold DIFFERENT 32 bytes. That rules out ordering, id
      # namespacing and a missing credential by observation.
      #
      # It does not say WHICH input differs. arnika derives the PPK as
      # HKDF-SHA3-256(qkd_key || pqc_key) (submodules/arnika/kdf/kdf.go), so
      # exactly one of the two halves must differ, and nothing in the system
      # ever compares them across the pair. This step does.
      #
      # The PQC half is no longer a file. At the pin (upstream PR #51's head,
      # f4cf9ba) arnika agrees it with the peer itself over PQC-HPKE, one key
      # per numbered round, and holds it only in memory, so the sha256 of
      # /var/lib/rosenpass/pqc.psk this step used to print has nothing left to
      # hash. What both peers do log is which round each one agreed
      # (`round agreed a fresh PQC key ... round=N as=initiator|responder`,
      # repositories/pqchpke/pqchpke.go). Two peers that agreed different sets
      # of rounds, or failed one the other agreed, can feed HKDF different PQC
      # keys; identical round lists put the PQC half out of suspicion for the
      # rounds shown. Round numbers and roles only -- no key material is in
      # these lines.
      #
      # Non-fatal by design: it is evidence, not an assertion. Making it fail
      # the build before the mechanism is understood would only add a second
      # red job saying the same thing as the first.
      - name: Which half of HKDF(QKD || PQC) diverges
        if: always()
        run: |
          set -u
          echo "=== PQC half: the PQC-HPKE rounds each peer agreed (last 12) ==="
          for node in alice-ipsec bob-ipsec; do
            echo "  --- $node"
            docker logs -t "$node" 2>&1 \
              | sed -nE 's/^([^ ]+) .*msg="round agreed a fresh PQC key".* (round=[0-9]+) (as=[a-z]+).*/\1 \2 \3/p' \
              | tail -12 | sed 's/^/      /' || true
            n_fail=$(docker logs "$node" 2>&1 | grep -cE 'msg="round (failed|abandoned)' || true)
            echo "      -- rounds failed or abandoned: ${n_fail}"
          done
          echo "=== QKD half: the key_id exchange, WITH roles ==="
          # Bare ids are not enough. Measured on 2026-08-23: a failing run showed
          # two ids on alice that were absent from bob's list, which looks like
          # the answer -- but the ids alone cannot distinguish "bob never
          # received it" from "the tail cut it off". Only one id carried role
          # context, and that one was healthy (pin-era format):
          #   PRIMARY[11] [SND] send key_id c7f2a948
          #   BACKUP[12]  [RCV] received key_id c7f2a948
          #   BACKUP[12]  [REQ] request QKD key for key_id c7f2a948
          # arnika elects a PRIMARY per interval; it fetches enc_keys, sends the
          # id, and the BACKUP resolves that id via dec_keys. If an id is sent
          # on one node with no matching receipt on the other, the two ends
          # derive from different QKD keys. Capture both sides so the next
          # failure settles it.
          #
          # At f4cf9ba the same three events are slog records, with the role
          # attached by `.With("role", ...)` (main.go, transport/server.go):
          #   msg="sending the key_id to the peer" arnika_id=11 role=primary key_id=<uuid> peer=...
          #   msg="received a key_id from the peer" arnika_id=12 role=backup key_id=<uuid> peer=...
          #   msg="requesting the QKD key for the peer's key_id" arnika_id=12 role=backup key_id=<uuid> kms=...
          # Both patterns are kept, so a rollback's logs still read. The
          # docker timestamp stays on each line, since the question is often
          # "when", not only "whether".
          for node in alice-ipsec bob-ipsec; do
            echo "  --- $node"
            docker logs -t "$node" 2>&1 \
              | sed -nE \
                  -e 's/^([^ ]+) .*(msg="[^"]*"[^"]{0,40}role=(primary|backup) key_id=[0-9a-fA-F-]{36}).*/\1 \2/p' \
                  -e 's/^([^ ]+) .*((PRIMARY|BACKUP)\[[0-9]+\].{0,14}\[(SND|RCV|REQ|OK)\].{0,60}key_id [0-9a-fA-F-]{36}).*/\1 \2/p' \
              | tail -14 | sed 's/^/      /' || true
            echo "      -- bare ids (fallback if the patterns above miss):"
            docker logs "$node" 2>&1 \
              | grep -aoE 'key_id[= ][0-9a-fA-F-]{36}' | sort -u | tail -10 | sed 's/^/        /' || true
          done
          echo
          echo "Reading it: the same PQC rounds on both peers + a shared key_id"
          echo "means both inputs agreed and the divergence is downstream of the"
          echo "KDF. A round agreed on one peer only localises it to the PQC half;"
          echo "a key_id present on one node only localises it to the QKD half."

      # The same logs, counted rather than listed: rotations R, failures F and
      # the five failure classes, split by alice's role in the interval, with
      # Clopper-Pearson intervals. scripts/ppk_race_report.py reads both
      # arnika log formats (the previous pin's bracketed tags and f4cf9ba's
      # slog records), so a before/after comparison reads the same rules on
      # both arms. It also pairs the two nodes' interval boundaries per
      # wall-clock tick and prints the offset between them, any tick whose
      # interval numbers differ, and, per segment of the window, how many
      # key_ids arrived before the BACKUP's boundary and how many BACKUP
      # intervals ended in a `no key_id from the peer` invalidation. With
      # --json it also lists every paired tick. It prints counts, generation
      # numbers, interval numbers, offsets and timestamps only, never a
      # key_id, a credential id or an identity.
      #
      # Evidence, not a gate: continue-on-error keeps a crash of the report
      # visible as an annotation without failing the lane over it. The runner's
      # own python3 suffices; the script uses the standard library only.
      - name: PPK outcomes by alice's role
        if: always()
        continue-on-error: true
        run: python3 scripts/ppk_race_report.py report --docker

      - name: Assert traffic actually traverses ESP
        run: |
          set -eu
          docker exec alice-ipsec ping -c 3 -W 2 10.30.0.21
          out=$(docker exec alice-ipsec swanctl --list-sas | grep -m1 'out ')
          echo "$out"
          # A tunnel that is up but installs no ESP counters is passing traffic
          # in the clear past the policy.
          echo "$out" | grep -qE '[1-9][0-9]* bytes' \
            || { echo "::error::no bytes counted on the outbound ESP SA"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          for node in alice-ipsec bob-ipsec; do
            echo "===== $node ====="
            docker logs --tail 200 "$node" 2>&1 || true
            docker exec "$node" swanctl --list-sas 2>&1 || true
            docker exec "$node" ip xfrm policy 2>&1 || true
          done
