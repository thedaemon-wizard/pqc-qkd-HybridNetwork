# ============================================================
# Cloud overlay for a single public host (any KVM VPS).
#
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.cloud.yml up -d --build
#
# What it changes vs. the base compose:
#   - Adds a Caddy reverse proxy as the ONLY public service (80/443),
#     with automatic Let's Encrypt TLS for $PUBLIC_HOST.
#   - Keeps the WebUI frontend/backend bound to loopback on the host
#     (set in deploy/.env.example: WEBUI_FRONTEND_PORT=127.0.0.1:5173,
#     WEBUI_BACKEND_PORT=127.0.0.1:8000) so they are reachable only via
#     the docker network / Caddy, never directly from the internet.
#   - WireGuard alice/bob traffic stays container-to-container on the
#     internal networks; no WG UDP ports are published.
#   - Adds restart policies for unattended operation, stack-status's
#     included. stack-status, the one container with the Docker socket,
#     publishes no port in any file; webui-backend reaches it on status-net.
#   - Keeps every internet-facing container off the KMEs' network. The KMEs'
#     ETSI GS QKD 014 key API, /internal/sync and simulator controls carry no
#     authentication. mgmt-net is where Caddy, the frontend, webui-backend and
#     any site a caddy.d/ drop-in proxies to on this host sit, so the KMEs and
#     pqc-validator leave it, and webui-backend leaves qkd-net: the nodes alone
#     reach the KMEs there. The backend reads KME status through kme-relay,
#     which passes only the GET routes it uses (deploy/kme-relay.Caddyfile),
#     and reaches pqc-validator on backend-net. Both qkd-net and backend-net are
#     internal.
#
# The privileged WireGuard nodes (cap NET_ADMIN/SYS_MODULE, /dev/net/tun)
# require a real kernel — fine on a KVM VPS, impossible on managed PaaS.
# See deploy/README.md for the deployment rationale.
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - webui-frontend
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Operator drop-in directory for extra sites on this host (for
      # example a second project sharing this Caddy). Contents are
      # gitignored, so they survive `git reset --hard` and re-clones --
      # unlike editing the tracked Caddyfile, which a history rewrite or
      # a reset would silently revert and take those sites offline.
      - ./deploy/caddy.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      mgmt-net: {}

  webui-frontend:
    restart: unless-stopped

  webui-backend:
    restart: unless-stopped
    depends_on:
      - kme-relay
    # Not on qkd-net here: the KME reads go through kme-relay (see the header).
    networks: !override
      mgmt-net: {}
      status-net: {}
      backend-net: {}
    environment:
      KME_A_URL: http://kme-relay:8081
      KME_B_URL: http://kme-relay:8082
      # This overlay IS the public host. The two values equal the backend's
      # own defaults; they are stated here so that a change of default cannot
      # loosen the public host unnoticed. Exports reach the visitor's browser
      # first; the server copy is a convenience, not the download path, so a
      # tight cap costs nothing.
      EXPORT_MAX_FILES: "100"
      EXPORT_MAX_BYTES: "26214400"   # 25 MiB

  # The only holder of the Docker socket; internal, no published port.
  stack-status:
    restart: unless-stopped

  bb84-kme-a:
    restart: unless-stopped
    networks: !override
      qkd-net:
        aliases: [bb84-kme-a]

  bb84-kme-b:
    restart: unless-stopped
    networks: !override
      qkd-net: {}

  pqc-validator:
    restart: unless-stopped
    networks: !override
      backend-net: {}

  # Read-only relay from webui-backend to the KMEs (deploy/kme-relay.Caddyfile):
  # the GET routes the backend reads pass, anything else gets 403. No published
  # port; it sits on qkd-net with the KMEs and on backend-net with the backend.
  kme-relay:
    image: caddy:2-alpine
    container_name: kme-relay
    restart: unless-stopped
    depends_on:
      - bb84-kme-a
      - bb84-kme-b
    volumes:
      - ./deploy/kme-relay.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      qkd-net: {}
      backend-net: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  alice:
    restart: unless-stopped

  bob:
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  # webui-backend, kme-relay and pqc-validator. Internal: no route off the host.
  backend-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.60.0.0/24
