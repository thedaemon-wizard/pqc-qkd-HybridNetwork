# ===================================================================
# Override file: point wg-quick at a userspace WireGuard implementation when
# the host kernel module is unavailable.
#
# THIS OVERLAY IS NOW REDUNDANT, and kept only to make the mechanism explicit.
#
# nodes/alice/Dockerfile installs `wireguard-go`, which is what wg-quick falls
# back to by DEFAULT:
#
#   cmd "${WG_QUICK_USERSPACE_IMPLEMENTATION:-wireguard-go}" "$INTERFACE"
#
# so a host without the kernel module now works with no override at all. Bring
# the stack up normally; this file changes nothing.
#
# History, because the previous state was worse than a missing feature: the
# overlay named `boringtun`, which was not in the image, and wg-quick exits
# when the module is absent AND the binary is missing -- exactly the case the
# fallback exists for. An earlier note here claimed wireguard-go was not
# packaged for bookworm; it is, in main, 2.5 MB, depending only on libc6. That
# note misread `apt-cache policy`, whose `Installed: (none)` line refers to the
# local system and not to availability.
#
#   docker compose -f docker-compose.yml -f docker-compose.boringtun.yml up -d
# ===================================================================
name: pqcqkd

services:
  alice:
    environment:
      WG_QUICK_USERSPACE_IMPLEMENTATION: boringtun
  bob:
    environment:
      WG_QUICK_USERSPACE_IMPLEMENTATION: boringtun
