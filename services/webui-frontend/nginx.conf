server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in the Server header or on the
    # default error pages; the public demo disclosed its exact release.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large export uploads (high-DPI PNG / full-res GIF / 10s+ WebM) to be
    # saved via POST /api/exports/save. nginx defaults to 1 MB; the backend caps
    # at EXPORT_MAX_BYTES (50 MB). Without this, large exports 413 and only the
    # client-side download fallback works.
    client_max_body_size 64m;

    # Caching. Without any Cache-Control, browsers cache index.html on a
    # heuristic (a fraction of its Last-Modified age) and keep running the OLD
    # bundle after a deploy. That produced a false defect report on 2026-09-16:
    # /paper-flow's Step button was "broken" in a tab still executing the
    # previous build (checklist row 4.8.18 now compares bundle hashes first).
    #
    # index.html names the hashed bundle, so it must be revalidated on every
    # load; `no-cache` means "revalidate", not "do not store". The files under
    # /assets/ carry a content hash in their name and never change under that
    # name, so they can be cached for a year.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # The SPA fallback above is an internal redirect to /index.html, which lands
    # here, so client-side routes (/e2e, /vpn, ...) get the same header.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # `=404`, not the SPA fallback: a request for a bundle that no longer exists
    # must fail, not be answered with index.html under a one-year immutable
    # header. And no `always` here, so the one-year header rides on 200/304
    # only -- a 404 for a missing bundle must not be cached for a year either.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy backend API + WebSocket to webui-backend container
    location /api/ {
        proxy_pass http://webui-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # `location /ws/` was here. Removed 2026-08-28: it proxied WebSocket
    # upgrades to webui-backend, which declares ZERO `@app.websocket` routes --
    # `grep -c '@app.websocket' services/webui-backend/app/main.py` is 0. No
    # frontend code opens a socket either (`grep -rn 'new WebSocket' src/`
    # returns nothing), because /e2e and /paper-flow moved to client-side
    # simulation and the orchestrators that used to serve frames were deleted.
    #
    # Verified live before removal: GET /ws/frames returned 404, as JSON, from
    # the backend. Verified live AFTER removal on the deployed build: it returns
    # 200 with the SPA shell, because /ws/ now falls through to `location /` and
    # `try_files ... /index.html` like any other unmatched path -- byte-identical
    # to GET /definitely-not-a-route.
    #
    # So the removal was NOT behaviour-preserving, and the pull request that
    # made it claimed it was ("404 before this change and after it"). The status
    # code did change. What did not change is that no WebSocket can be
    # established either way, and /ws/ has stopped being a special case. `/api/`
    # still returns 404 JSON, which is the distinction that matters: an unknown
    # API path reports an error, an unknown UI path renders the app's own
    # not-found view.
    #
    # It was not merely dead, it was dead with a 24-hour `proxy_read_timeout`:
    # a client that did upgrade would hold a worker connection open all day to
    # be told nothing. Config that looks like a feature and cannot work is the
    # same shape as the `/api/sim/optimize` route deleted earlier today.
}
