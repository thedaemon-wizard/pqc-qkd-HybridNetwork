server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large export uploads (high-DPI PNG / full-res GIF / 10s+ WebM) to be
    # saved via POST /api/exports/save. nginx defaults to 1 MB; the backend caps
    # at EXPORT_MAX_BYTES (50 MB). Without this, large exports 413 and only the
    # client-side download fallback works.
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API + WebSocket to webui-backend container
    location /api/ {
        proxy_pass http://webui-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # `location /ws/` was here. Removed 2026-08-28: it proxied WebSocket
    # upgrades to webui-backend, which declares ZERO `@app.websocket` routes --
    # `grep -c '@app.websocket' services/webui-backend/app/main.py` is 0. No
    # frontend code opens a socket either (`grep -rn 'new WebSocket' src/`
    # returns nothing), because /e2e and /paper-flow moved to client-side
    # simulation and the orchestrators that used to serve frames were deleted.
    #
    # Verified live before removal: GET /ws/frames returned 404.
    #
    # It was not merely dead, it was dead with a 24-hour `proxy_read_timeout`:
    # a client that did upgrade would hold a worker connection open all day to
    # be told nothing. Config that looks like a feature and cannot work is the
    # same shape as the `/api/sim/optimize` route deleted earlier today.
}
