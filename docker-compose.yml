# ===================================================================
# PQC-QKD Hybrid PoC — Docker Compose
#
# 3 networks:
#   - qkd-net (internal):  KME <-> arnika                ETSI 014 traffic
#   - wan-net:             WireGuard endpoints           Public Internet sim
#   - mgmt-net:            WebUI <-> backend <-> logs    Management plane
#
# The WireGuard lane runs two tunnels per node pair:
#   wg0  hop tunnel keyed by arnika (HKDF-SHA3-256 over the QKD key and a
#        PQC-HPKE key)
#   wg1  data tunnel keyed by Rosenpass (Classic McEliece 460896 + Kyber512),
#        carried inside wg0, with the Rosenpass exchange itself inside wg0
# (nodes/alice/entrypoint.sh). arnika is built by nodes/alice/Dockerfile from
# submodules/arnika, pinned to f4cf9ba: the head of the open, unmerged upstream
# PR arnika-project/arnika#51, to be re-pinned to the merge commit once #51
# merges. PQC-HPKE is HPKE Base mode (RFC 9180) with the hybrid KEM
# MLKEM1024-P384 (draft-ietf-hpke-pq, not yet an RFC), HKDF-SHA384 and an
# export-only AEAD.
# BB84-KME is a Python service implementing QuTiP + ETSI GS QKD 014 REST.
# ===================================================================
name: pqcqkd

networks:
  qkd-net:
    driver: bridge
    internal: true        # Isolate "quantum classical channel"
    ipam:
      config:
        - subnet: 10.20.0.0/24
  wan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
  mgmt-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24

volumes:
  bb84-keypool-a:
  bb84-keypool-b:
  rosenpass-keys-alice:
  rosenpass-keys-bob:
  wg-keys-alice:         # persist the wg0 and wg1 keypairs (stable across recreates)
  wg-keys-bob:
  node-pubkeys:          # shared: nodes swap wg0, wg1 and Rosenpass public keys
  pqcqkd-logs:           # Phase 12-A: shared rotating log files
  pqcqkd-exports:        # Phase 13: backend-stored export artefacts

services:

  # -------------------------------------------------------------
  # BB84 + ETSI-014 KME (per-SAE instance)
  # -------------------------------------------------------------
  bb84-kme-a:
    build:
      context: .
      dockerfile: services/bb84-kme/Dockerfile
    image: pqcqkd/bb84-kme:local
    container_name: bb84-kme-a
    environment:
      SAE_ID: ALICE
      PEER_SAE_ID: BOB
      PEER_KME_URL: http://bb84-kme-b:8080
      QKD_PARAMS_FILE: /etc/pqcqkd/qkd_params.yaml
      # Optional override of the default QKD backend (empty -> use qkd_params.yaml,
      # i.e. simqn). Read when the KME starts, so a change needs the container
      # recreated. The image installs all four heavy backends at build time and
      # the build fails if one does not install; if the chosen backend still
      # fails to construct, KeyPool logs it and falls back to built-in `qutip`.
      SIMULATOR_BACKEND: ${SIMULATOR_BACKEND:-}
      # NumPy/SciPy/QuTiP load OpenBLAS, which auto-detects the CPU and may emit
      # instructions a cloud vCPU doesn't expose -> "Illegal instruction" SIGILL
      # that crashes the KME on startup (and can't be caught in Python). If that
      # happens on a VPS, pin a safe baseline, e.g.
      # OPENBLAS_CORETYPE=Haswell. Empty default = OpenBLAS auto-detect.
      OPENBLAS_CORETYPE: ${OPENBLAS_CORETYPE:-}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
      SIMQN_PATH: /submodules/SimQN
      SEQUENCE_PATH: /submodules/SeQUeNCe
      STRAWBERRYFIELDS_PATH: /submodules/strawberryfields
      LOG_LEVEL: INFO
    volumes:
      - bb84-keypool-a:/var/lib/bb84
      - ./config:/etc/pqcqkd:ro
      - ./submodules/SimQN:/submodules/SimQN:ro
      - ./submodules/SeQUeNCe:/submodules/SeQUeNCe:ro
      - ./submodules/strawberryfields:/submodules/strawberryfields:ro
      - pqcqkd-logs:/var/log/pqcqkd
    networks:
      qkd-net:
        aliases: [bb84-kme-a]
      mgmt-net: {}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  bb84-kme-b:
    image: pqcqkd/bb84-kme:local
    container_name: bb84-kme-b
    depends_on:
      bb84-kme-a:
        condition: service_started
    environment:
      SAE_ID: BOB
      PEER_SAE_ID: ALICE
      PEER_KME_URL: http://bb84-kme-a:8080
      QKD_PARAMS_FILE: /etc/pqcqkd/qkd_params.yaml
      SIMULATOR_BACKEND: ${SIMULATOR_BACKEND:-}   # see bb84-kme-a note above
      OPENBLAS_CORETYPE: ${OPENBLAS_CORETYPE:-}    # see bb84-kme-a note (VPS SIGILL fix)
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
      SIMQN_PATH: /submodules/SimQN
      SEQUENCE_PATH: /submodules/SeQUeNCe
      STRAWBERRYFIELDS_PATH: /submodules/strawberryfields
      LOG_LEVEL: INFO
    volumes:
      - bb84-keypool-b:/var/lib/bb84
      - ./config:/etc/pqcqkd:ro
      - ./submodules/SimQN:/submodules/SimQN:ro
      - ./submodules/SeQUeNCe:/submodules/SeQUeNCe:ro
      - ./submodules/strawberryfields:/submodules/strawberryfields:ro
      - pqcqkd-logs:/var/log/pqcqkd
    networks:
      qkd-net: {}
      mgmt-net: {}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # -------------------------------------------------------------
  # Alice node: wg0 (arnika) + wg1 inside wg0 (Rosenpass sidecar)
  # -------------------------------------------------------------
  alice:
    build:
      context: .
      dockerfile: nodes/alice/Dockerfile
    image: pqcqkd/node-alice:local
    container_name: alice
    # No IPC_LOCK. arnika tries mlockall at startup, which on a Go binary locks
    # the runtime's whole heap arena reservation (about 1.2 GB per process by
    # arnika's own measurement, hardening/hardening_linux.go). Without the
    # capability the lock fails, arnika logs "process hardening incomplete"
    # and carries on, which is the intended best-effort behaviour.
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    depends_on:
      bb84-kme-a:
        condition: service_healthy
      bb84-kme-b:
        condition: service_healthy
    environment:
      NODE_NAME: alice
      WG_IFACE: wg0
      WG_LISTEN_PORT: ${WG_LISTEN_PORT_ALICE:-51820}
      WG_LOCAL_IP: ${WG_ALICE_IP:-10.0.0.1}
      WG_PEER_IP: ${WG_BOB_IP:-10.0.0.2}
      WG_PEER_ENDPOINT: bob:${WG_LISTEN_PORT_BOB:-51821}
      # wg1, the data tunnel. Its endpoint is bob's wg0 address (WG_PEER_IP)
      # and bob's wg1 port, so wg1 traffic travels inside wg0.
      WG1_IFACE: wg1
      WG1_LISTEN_PORT: ${WG1_LISTEN_PORT_ALICE:-51830}
      WG1_LOCAL_IP: ${WG1_ALICE_IP:-10.0.1.1}
      WG1_PEER_IP: ${WG1_BOB_IP:-10.0.1.2}
      WG1_PEER_PORT: ${WG1_LISTEN_PORT_BOB:-51831}
      # Arnika env (consumed by entrypoint -> exported to arnika binary).
      # MODE and PQC_ENABLED must be identical on both peers, which is why
      # both nodes read the same variable and the same literal.
      ARNIKA_MODE: ${ARNIKA_MODE:-QkdAndPqcRequired}
      # arnika's own PQC-HPKE key agreement, the PQC half of the wg0 PSK.
      # A literal: the lane is defined as QKD || PQC-HPKE, and
      # MODE=QkdAndPqcRequired refuses to start without it.
      PQC_ENABLED: "true"
      ARNIKA_INTERVAL: ${ARNIKA_INTERVAL:-30s}
      # ETSI GS QKD 014 clause 5.1: the SAE ID in the path is the PEER --
      # enc_keys names the slave SAE, dec_keys names the master SAE. From
      # Alice's side both are BOB, which is why one base URL serves both.
      KMS_URL: http://bb84-kme-a:8080/api/v1/keys/BOB
      PEER_SAE_ID: BOB
      LISTEN_ADDRESS: 0.0.0.0:9999
      SERVER_ADDRESS: bob:9999
      # Must differ from the peer's: arnika XORs this into the per-interval
      # master election, so equal IDs make both nodes take the same role.
      ARNIKA_ID: ${ARNIKA_ID_ALICE:-1}
      # Must be IDENTICAL on both peers: keys the AES-256-GCM + HMAC on every
      # arnika packet (key_ID and PQC-HPKE frames) and the role election. At
      # least 32 bytes; the entrypoint also refuses the .env.example placeholder.
      ARNIKA_PSK: ${ARNIKA_PSK:?ARNIKA_PSK must be set in .env}
      # Rosenpass (real post-quantum exchange, keys wg1). It binds alice's wg0
      # address on this port and initiates to bob's wg0 address, so the
      # exchange runs inside wg0. Only the lower wg0 address of a pair
      # initiates; bob answers (nodes/alice/entrypoint.sh says why).
      RP_LISTEN_PORT: ${RP_LISTEN_PORT:-9997}
      RP_PEER_PORT: ${RP_LISTEN_PORT:-9997}
      ROSENPASS_SECRET_DIR: /etc/rosenpass-secret
      SHARED_DIR: /shared
      KMS_HTTP_TIMEOUT: ${KMS_HTTP_TIMEOUT:-10s}
      KMS_BACKOFF_MAX_RETRIES: ${KMS_BACKOFF_MAX_RETRIES:-5}
      KMS_BACKOFF_BASE_DELAY: ${KMS_BACKOFF_BASE_DELAY:-200ms}
      KMS_RETRY_INTERVAL: ${KMS_RETRY_INTERVAL:-10s}
    volumes:
      - rosenpass-keys-alice:/etc/rosenpass-secret
      - wg-keys-alice:/etc/wireguard
      - node-pubkeys:/shared
    networks:
      qkd-net: {}
      wan-net:
        ipv4_address: 10.30.0.10

  # -------------------------------------------------------------
  # Bob node
  # -------------------------------------------------------------
  bob:
    image: pqcqkd/node-alice:local      # same image, role-switched via env
    build:
      context: .
      dockerfile: nodes/alice/Dockerfile
    container_name: bob
    # No IPC_LOCK: see alice.
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.ip_forward: 1
    depends_on:
      bb84-kme-a:
        condition: service_healthy
      bb84-kme-b:
        condition: service_healthy
    environment:
      NODE_NAME: bob
      WG_IFACE: wg0
      WG_LISTEN_PORT: ${WG_LISTEN_PORT_BOB:-51821}
      WG_LOCAL_IP: ${WG_BOB_IP:-10.0.0.2}
      WG_PEER_IP: ${WG_ALICE_IP:-10.0.0.1}
      WG_PEER_ENDPOINT: alice:${WG_LISTEN_PORT_ALICE:-51820}
      # See alice: wg1 reaches alice's wg0 address, so it runs inside wg0.
      WG1_IFACE: wg1
      WG1_LISTEN_PORT: ${WG1_LISTEN_PORT_BOB:-51831}
      WG1_LOCAL_IP: ${WG1_BOB_IP:-10.0.1.2}
      WG1_PEER_IP: ${WG1_ALICE_IP:-10.0.1.1}
      WG1_PEER_PORT: ${WG1_LISTEN_PORT_ALICE:-51830}
      ARNIKA_MODE: ${ARNIKA_MODE:-QkdAndPqcRequired}
      PQC_ENABLED: "true"
      ARNIKA_INTERVAL: ${ARNIKA_INTERVAL:-30s}
      # See the note on alice: the SAE ID in the path is always the PEER.
      KMS_URL: http://bb84-kme-b:8080/api/v1/keys/ALICE
      PEER_SAE_ID: ALICE
      LISTEN_ADDRESS: 0.0.0.0:9999
      SERVER_ADDRESS: alice:9999
      ARNIKA_ID: ${ARNIKA_ID_BOB:-2}
      ARNIKA_PSK: ${ARNIKA_PSK:?ARNIKA_PSK must be set in .env}
      # Rosenpass (keys wg1): binds bob's wg0 address and answers alice.
      RP_LISTEN_PORT: ${RP_LISTEN_PORT:-9997}
      RP_PEER_PORT: ${RP_LISTEN_PORT:-9997}
      ROSENPASS_SECRET_DIR: /etc/rosenpass-secret
      SHARED_DIR: /shared
      KMS_HTTP_TIMEOUT: ${KMS_HTTP_TIMEOUT:-10s}
      KMS_BACKOFF_MAX_RETRIES: ${KMS_BACKOFF_MAX_RETRIES:-5}
      KMS_BACKOFF_BASE_DELAY: ${KMS_BACKOFF_BASE_DELAY:-200ms}
      KMS_RETRY_INTERVAL: ${KMS_RETRY_INTERVAL:-10s}
    volumes:
      - rosenpass-keys-bob:/etc/rosenpass-secret
      - wg-keys-bob:/etc/wireguard
      - node-pubkeys:/shared
    networks:
      qkd-net: {}
      wan-net:
        ipv4_address: 10.30.0.11

  # -------------------------------------------------------------
  # WebUI Backend (FastAPI orchestrator)
  # -------------------------------------------------------------
  webui-backend:
    build:
      context: ./services/webui-backend
      dockerfile: Dockerfile
    image: pqcqkd/webui-backend:local
    container_name: webui-backend
    depends_on:
      - bb84-kme-a
      - bb84-kme-b
    environment:
      KME_A_URL: http://bb84-kme-a:8080
      KME_B_URL: http://bb84-kme-b:8080
      PQC_VALIDATOR_URL: http://pqc-validator:8090
      LOG_LEVEL: INFO
      # Reported by /api/config so the Overview states the configured rotation
      # interval instead of a literal. Same default as the arnika services.
      ARNIKA_INTERVAL: ${ARNIKA_INTERVAL:-30s}
      # Live parameter overrides are OPT-IN, like container control.
      #
      # POST /api/sim/params, /api/sim/params/reset and /api/sim/backend change
      # process-global state on BOTH KMEs -- the simulator backend, Eve, the
      # QBER abort threshold, link length -- and those KMEs feed arnika's key
      # supply. On a shared host one visitor's edit therefore reaches every
      # other visitor and both VPN lanes, last write wins. Off (the default),
      # the three routes answer 403, /api/config reports
      # `live_param_overrides: false`, and /physics edits only the in-browser
      # model it already computes key rates from. Set true on a single-user
      # local stack to drive the live KMEs from the page.
      ENABLE_LIVE_PARAM_OVERRIDES: ${ENABLE_LIVE_PARAM_OVERRIDES:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - pqcqkd-logs:/var/log/pqcqkd
      - pqcqkd-exports:/var/lib/pqcqkd-exports
    ports:
      - "${WEBUI_BACKEND_PORT:-8000}:8000"
    networks:
      mgmt-net: {}
      qkd-net: {}

  # -------------------------------------------------------------
  # WebUI Frontend (React + Vite, served by nginx)
  # -------------------------------------------------------------
  webui-frontend:
    build:
      context: ./services/webui-frontend
      dockerfile: Dockerfile
    image: pqcqkd/webui-frontend:local
    container_name: webui-frontend
    depends_on:
      - webui-backend
    ports:
      - "${WEBUI_FRONTEND_PORT:-5173}:80"
    networks:
      mgmt-net: {}

  # -------------------------------------------------------------
  # PQC Validator (Phase 8): liboqs, plus the @noble-vs-liboqs ML-KEM interop
  # endpoint. There is no PQClean comparison -- see services/pqc-validator/
  # app/main.py for why building one would not be an improvement.
  # -------------------------------------------------------------
  pqc-validator:
    build:
      context: .
      dockerfile: services/pqc-validator/Dockerfile
    image: pqcqkd/pqc-validator:local
    container_name: pqc-validator
    environment:
      LOG_LEVEL: INFO
    volumes:
      - pqcqkd-logs:/var/log/pqcqkd
    networks:
      mgmt-net: {}
      qkd-net: {}
