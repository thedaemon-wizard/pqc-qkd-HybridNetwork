# ================================================================
# Central QKD physics & protocol parameter file (Phase 8)
# ----------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for every numeric value
# in the BB84-KME stack.  No literal numbers may appear inside the
# Python sources under services/bb84-kme/app/ except trivial ones
# (0, 1, ...).  CI test `tests/test_no_hardcoded_params.py` enforces this.
#
# Hot-reload: the bb84-kme process watches this file; on change the
# new values take effect at the next BB84 round.
#
# Provenance of defaults:
#   - fiber attenuation: ITU-T G.652 SMF spec (0.18-0.22 dB/km @1550nm)
#   - detector η_d:      SNSPD typical 20-90 % (Hadfield Nature Photonics 2009)
#   - dark count:        SNSPD typical 10-1000 Hz
#   - decoy intensities: Lo-Ma-Chen PRL 94 230504 (2005)
#   - finite-key:        Lim et al. PRA 89, 022307 (2014), arXiv:1311.7129
#   - f_EC:              Cascade efficiency 1.10-1.20 (Brassard-Salvail 1994)
#   - misalignment e_d:  typical 0.5-1.5 % polarisation drift
# ================================================================

physical:
  fiber_attenuation_db_per_km: 0.20      # ITU-T G.652 reference
  link_length_km: 10.0                   # editable via WebUI slider
  detector_efficiency: 0.20              # SNSPD typical
  dark_count_rate_hz: 100.0
  after_pulse_prob: 0.001
  misalignment_error_ed: 0.015           # polarisation basis misalignment

detector:
  # Timing characteristics of the single-photon detector, used by the TNO
  # key-rate backend's Detector model. These lived as literals inside
  # services/bb84-kme/app/backends/tno_backend.py, which broke this file's own
  # "single source of truth" rule and made tests/test_no_hardcoded_params.py
  # fail. Values are SNSPD-typical (Hadfield, Nature Photonics 3, 696 (2009)).
  jitter_source_s: 0.0                   # transform-limited source assumption
  jitter_detector_s: 5.0e-11             # 50 ps timing jitter
  dead_time_s: 4.5e-08                   # 45 ns recovery time
  detection_frequency_hz: 1.0e7          # 10 MHz gating / readout rate
  detection_window: 5                    # window width, in jitter units
  efficiency_system: 1.0                 # optics loss already folded into detector_efficiency

source:
  source_type: "WCP"                     # weak coherent pulse
  pulse_rate_hz: 1.0e9                   # 1 GHz industry standard
  intensity_signal_mu: 0.5               # set to "auto" to invoke Bayesian Opt
  intensity_decoy_1_nu1: 0.1
  intensity_decoy_2_nu2: 0.0
  basis_bias_pz: 0.5                     # symmetric BB84
  # Intensity-choice probabilities. Required by the Lim et al. finite-key
  # analysis and NOT cosmetic: tau_n = sum_k p_k e^-k k^n / n! depends on them,
  # and the Hoeffding deviation is divided by p_k, so a rare intensity is
  # penalised in proportion to how rarely it is sent. Must sum to 1.
  prob_signal_mu: 0.70
  prob_decoy_1_nu1: 0.15
  prob_decoy_2_nu2: 0.15

protocol:
  # PULSES SENT by Alice, all bases and all intensities, detected or not.
  #
  # The name is kept for compatibility but the meaning is now pinned, because
  # it was ambiguous and the ambiguity is worth 100+ km. In Lim et al. this N
  # appears in exactly ONE place -- the final division rate = ell / N -- and in
  # no bound. The statistics are driven by the DETECTION counts n_X, n_Z, m_Z,
  # which are channel-dependent. Reading this as Bob's post-processing block
  # (n_X) rather than Alice's pulses differs by ~550x at 50 km and moves the
  # zero-crossing from ~98 km to ~205 km.
  block_size_N: 1000000000               # pulses sent (1e9)
  # eps_sec: the SECRECY parameter. Lim supp. Eq. (14) composes it from seven
  # terms; setting them all equal gives eps_sec = 21 * eps, which is why the
  # key length carries 6*log2(21/eps_sec).
  security_epsilon: 1.0e-10              # eps_sec (composable secrecy)
  # eps_cor: the CORRECTNESS parameter -- the error-verification hash collision
  # probability. A distinct quantity from eps_sec, and previously absent
  # entirely, which meant the protocol was eps_cor-correct for no stated value.
  # Total protocol security is eps_sec + eps_cor.
  correctness_epsilon: 1.0e-15
  ec_efficiency_f: 1.16                  # Cascade
  # NOT the Lo-Ma bound, which is what this line used to say. 0.11 is the
  # Shor-Preskill root of 1 - 2*h2(e) = 0 (computed: 11.003 %), which holds
  # for IDEAL SINGLE PHOTONS with perfect error correction. The shipped
  # source is decoy-state weak-coherent with f_EC = 1.16, and its rate reaches
  # zero well before 0.11 -- at QBER 1.504 % (L = 93.3 km) for the FINITE-KEY
  # rate the accept predicate uses, and at QBER 6.602 % (L = 253.51 km) for
  # the asymptotic GLLP curve the UI displays. Those are 160 km apart.
  #
  # Keep 0.11 as the hard abort ceiling, but it is NOT the accept criterion:
  # from ~93 km to ~270 km the QBER is under 0.11 while the modelled rate is
  # exactly 0. Backends require skr_bps > 0 as well -- see `accepts_round()`
  # in services/bb84-kme/app/backends/_skr.py.
  #
  # 6.602 % is specific to mu = 0.5; the weak-coherent ceiling is mu-dependent
  # (6.16 % at mu = 0.5, rising to 9.81 % as mu -> 0). Not a protocol constant.
  qber_threshold_abort: 0.11             # hard abort ceiling (Shor-Preskill)
  out_bits_per_key: 256                  # what arnika needs (matches kms.go)

simulator:
  backend: "simqn"                       # qutip | simqn | sequence | cvqkd | composite
  bb84_batch_size: 2048                  # photons per discrete-event round
  pool_low_watermark: 8
  pool_max_size: 64
  rng_seed: 42                           # set to null for OS entropy

optimizer:
  enabled: false
  method: "bayesian_gp"                  # bayesian_gp | closed_form | table_lookup
  n_calls: 50
  acquisition: "EI"                      # expected improvement
  search_space:
    mu:  [0.30, 0.90]
    nu1: [0.05, 0.20]
    nu2: [0.00, 0.01]
    pz:  [0.50, 0.95]

eve:
  enabled: false
  intercept_prob: 0.0

cvqkd:                                   # Strawberry Fields backend
  protocol: "GG02"                       # Grosshans-Grangier 2002
  modulation_variance_V_A: 4.0           # shot noise units
  reconciliation: "reverse"
  excess_noise_xi: 0.01                  # ≈1% typical
  homodyne_phi_deg: 0.0                  # X-quadrature
  reconciliation_efficiency_beta: 0.95

hil:                                     # hardware-in-the-loop bridge
  enabled: false
  kms_url: ""                            # commercial device ETSI 014 endpoint
  ca_cert_file: ""
  client_cert_file: ""
  client_key_file: ""

webui:
  refresh_interval_ms: 1500
  ws_frame_buffer: 16
