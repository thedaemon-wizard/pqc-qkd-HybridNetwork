# =====================================================================
# Override file: adds the qkdnetsim-kme container, a second ETSI 014 server
# (a Flask facade; the image compiles NS-3/qkdnetsim but does not run it).
# Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.qkdnetsim.yml \
#                   --profile crossvalidate up -d
#
# No host port is published. The only clients are the bb84-kme backends
# `qkdnetsim_proxy` and `composite_sim_to_net`, which reach
# http://qkdnetsim-kme:80 over qkd-net. The mapping used to be "8081:80" on all
# interfaces: Docker-published ports bypass UFW's INPUT rules, so on the public
# host that would have exposed the unauthenticated /internal/set_rate route --
# and, until it was removed, a sync route that let anyone place a key of their
# choosing in the pool the proxy hands to arnika. It also collided with the
# contract tests' default peer URL (localhost:8081), silently turning a local
# "peer" run into a run against this facade.
# =====================================================================
name: pqcqkd

services:
  qkdnetsim-kme:
    build:
      context: .
      dockerfile: services/qkdnetsim-kme/Dockerfile
    image: pqcqkd/qkdnetsim-kme:local
    container_name: qkdnetsim-kme
    profiles: ["crossvalidate"]
    environment:
      SAE_ID: ALICE
      PEER_SAE_ID: BOB
      # One container serves both ends, so the source and target KME are the
      # same instance. Named rather than defaulted in kme_facade.py, which
      # previously reported the SAE IDs in the KME fields.
      KME_ID: qkdnetsim-kme
      PEER_KME_ID: qkdnetsim-kme
      KEY_SIZE_BITS: 256
      MAX_POOL: 64
      INITIAL_KEY_RATE_BPS: 1000.0
    networks:
      qkd-net: {}
      mgmt-net: {}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
