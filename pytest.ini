# Root pytest configuration.
#
# Previously the only pytest config lived in services/bb84-kme/pyproject.toml,
# which is not the rootdir when `make test` runs `pytest tests/` from the
# repository root -- so asyncio_mode was never applied and every async test
# was silently skipped with an "async def functions are not natively
# supported" failure.
[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live_stack: requires a running docker compose stack (KMEs reachable over HTTP)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
