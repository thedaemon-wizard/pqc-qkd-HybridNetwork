# =====================================================================
# charon configuration for the QKD/PQC IPsec node.
#
# The `load` line is load-bearing. Compiling a plugin does not make charon use
# it -- only this list does. Omitting `ml`/`openssl` here is the cause of the
# common "negotiated key exchange method ML_KEM_768 not supported" failure
# (strongSwan issue #2690).
#
# Order matters: the first plugin providing an algorithm wins. `openssl` comes
# first so ML-KEM is sourced from OpenSSL >= 3.5, with the self-contained `ml`
# plugin as the fallback provider.
#
# `vici` must be loaded: it is the only control interface here (the legacy
# `stroke` plugin has not been enabled by default since 6.0.0), and the arnika
# VICI key-writer talks to it directly.
# =====================================================================
charon {
    # Must be a single line: strongswan.conf has no line-continuation syntax.
    load = random nonce aes sha1 sha2 hmac kdf pem pkcs1 pkcs8 pubkey x509 revocation constraints curl openssl ml kernel-netlink socket-default updown vici

    # ML-KEM public keys and ciphertexts are 1184/1088 bytes. RFC 9242 moves
    # them into an encrypted IKE_INTERMEDIATE exchange so IKEv2 fragmentation
    # (RFC 7383) can apply; without fragmentation those messages would rely on
    # IP fragmentation and be dropped on many paths.
    fragment_size = 1280

    # Reauthentication is how a rotated RFC 8784 PPK actually enters the key
    # schedule, and this node reauthenticates on every rotation. Make-before-
    # break (the default since 6.0.0, set explicitly here because it is
    # load-bearing for us) creates the replacement SAs before tearing down the
    # old ones, so rotation does not interrupt traffic.
    make_before_break = yes

    # Surface real failures. The old shell bridge discarded every swanctl error
    # with `|| true`, which is precisely why the lane could appear healthy while
    # doing nothing.
    #
    # Log to stderr, not syslog: there is no syslog daemon in the container, so
    # a syslog block silently discards everything -- the same class of mistake
    # this rewrite exists to remove. `docker logs` is the transport here.
    filelog {
        stderr {
            default = 1
            ike = 2
            cfg = 2
            # NEVER raise this to 4: charon logs raw key material at DBG4
            # (vici_cred.c logs the shared key with DBG4), which would print
            # QKD-derived PPKs into the container log.
            knl = 1
        }
    }
}

swanctl {
    load = pem pkcs1 pkcs8 x509 pubkey openssl random
}
